
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemnitz Live Transport</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #243244;
}

header {
    height: 65px;
    background: white;
    border-bottom: 1px solid #e5eaf0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
}

.logo {
    font-size: 19px;
    font-weight: bold;
}

.status {
    font-size: 12px;
    color: #b7791f;
}

.container {
    height: calc(100vh - 65px);
    display: grid;
    grid-template-columns: 1fr 350px;
}

#map {
    width: 100%;
    height: 100%;
}

.sidebar {
    background: white;
    border-left: 1px solid #e5eaf0;
    overflow-y: auto;
}

.search {
    padding: 15px;
    border-bottom: 1px solid #eee;
}

.search input {
    width: 100%;
    padding: 12px;
    border: 1px solid #dce3eb;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
}

.panel-title {
    padding: 15px;
    border-bottom: 1px solid #eee;
}

.panel-title h2 {
    margin: 0 0 5px;
    font-size: 21px;
}

.panel-title p {
    margin: 0;
    color: #8491a2;
    font-size: 12px;
}

.stop-list {
    padding: 0 15px;
}

.stop-item {
    padding: 13px 5px;
    border-bottom: 1px solid #edf0f3;
    cursor: pointer;
    font-size: 13px;
}

.stop-item:hover {
    background: #f5f9fd;
}

.stop-item small {
    display: block;
    color: #8b98a8;
    margin-top: 4px;
}

.departures {
    padding: 15px;
}

.departure {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
}

.route {
    background: #e7f1fa;
    color: #1769aa;
    padding: 8px;
    min-width: 38px;
    text-align: center;
    border-radius: 6px;
    font-weight: bold;
}

.departure-info {
    flex: 1;
    min-width: 0;
}

.departure-info strong {
    display: block;
    font-size: 12px;
}

.departure-info small {
    color: #8995a3;
    font-size: 10px;
}

.departure-time {
    text-align: right;
    font-weight: bold;
    font-size: 13px;
}

button {
    cursor: pointer;
}

.back {
    border: none;
    background: none;
    color: #1675c5;
    padding: 15px;
    font-size: 13px;
}

.message {
    padding: 15px;
    color: #8491a2;
    font-size: 12px;
    line-height: 1.6;
}

.loading {
    padding: 25px;
    text-align: center;
    color: #64748b;
}

@media(max-width:750px) {
    .container {
        grid-template-columns: 1fr;
        grid-template-rows: 48% 52%;
    }

    .sidebar {
        border-left: none;
        border-top: 1px solid #e5eaf0;
    }

    header {
        height: 55px;
    }

    .container {
        height: calc(100vh - 55px);
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🚊 Chemnitz Live Transport</div>
    <div class="status" id="status">Daten werden geladen...</div>
</header>

<div class="container">

    <div id="map"></div>

    <aside class="sidebar">

        <div class="panel-title">
            <h2>Chemnitz</h2>
            <p>Öffentlicher Nahverkehr</p>
        </div>

        <div class="search">
            <input
                type="text"
                id="search"
                placeholder="Haltestelle suchen..."
            >
        </div>

        <div id="content">
            <div class="loading">
                Lade Verkehrsdaten...
            </div>
        </div>

    </aside>

</div>

<script>

// ======================================
// 1. MAP
// ======================================

const map = L.map('map', {
    minZoom: 6,
    maxZoom: 19,
    maxBounds: [
        [47, 5.5],
        [55.2, 15.8]
    ],
    maxBoundsViscosity: 1
}).setView([50.833, 12.925], 12);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
    }
).addTo(map);

const markers = L.layerGroup().addTo(map);

let stops = [];
let routes = {};
let trips = {};
let calendar = {};
let exceptions = {};
let stopTimes = {};

let selectedStop = null;


// ======================================
// 2. CSV PARSER
// ======================================

function parseCSV(text) {

    return Papa.parse(text, {
        header: true,
        skipEmptyLines: true
    }).data;
}


// ======================================
// 3. LOAD GTFS ZIP
// ======================================

async function loadGTFS() {

    try {

        const response = await fetch(
            './GTFS_VMS_2026-10-26.zip'
        );

        if (!response.ok) {
            throw new Error('GTFS ZIP nicht gefunden');
        }

        const buffer = await response.arrayBuffer();

        const zip = await JSZip.loadAsync(buffer);

        async function readFile(name) {

            const file = zip.file(name);

            if (!file) return [];

            return parseCSV(
                await file.async('text')
            );
        }

        const [
            rawStops,
            rawRoutes,
            rawTrips,
            rawTimes,
            rawCalendar,
            rawExceptions
        ] = await Promise.all([

            readFile('stops.txt'),
            readFile('routes.txt'),
            readFile('trips.txt'),
            readFile('stop_times.txt'),
            readFile('calendar.txt'),
            readFile('calendar_dates.txt')

        ]);

        // Chemnitz city area

        stops = rawStops.filter(s => {

            const lat = Number(s.stop_lat);
            const lon = Number(s.stop_lon);

            return (
                lat >= 50.70 &&
                lat <= 50.98 &&
                lon >= 12.75 &&
                lon <= 13.15
            );

        });

        rawRoutes.forEach(r => {
            routes[r.route_id] = r;
        });

        rawTrips.forEach(t => {
            trips[t.trip_id] = t;
        });

        rawCalendar.forEach(c => {
            calendar[c.service_id] = c;
        });

        rawExceptions.forEach(e => {

            if (!exceptions[e.date]) {
                exceptions[e.date] = {};
            }

            exceptions[e.date][e.service_id] =
                Number(e.exception_type);

        });

        // Index stop times by stop ID

        rawTimes.forEach(t => {

            if (!stopTimes[t.stop_id]) {
                stopTimes[t.stop_id] = [];
            }

            stopTimes[t.stop_id].push(t);

        });

        Object.values(stopTimes).forEach(list => {

            list.sort((a, b) =>
                timeToSeconds(a.departure_time) -
                timeToSeconds(b.departure_time)
            );

        });

        displayStops(stops);

        document.getElementById('status').textContent =
            stops.length + ' Haltestellen geladen';

        document.getElementById('content').innerHTML =
            '<div class="message">' +
            'Wähle eine Haltestelle auf der Karte oder in der Liste.' +
            '<br><br>' +
            'Die angezeigten Abfahrten basieren auf dem offiziellen GTFS-Fahrplan.' +
            '</div>';

    } catch(error) {

        console.error(error);

        document.getElementById('status').textContent =
            'Fehler beim Laden';

        document.getElementById('content').innerHTML =
            '<div class="message">' +
            'Die Fahrplandaten konnten nicht geladen werden. ' +
            'Prüfe, ob die ZIP-Datei neben index.html im GitHub-Repository liegt.' +
            '<br><br>' + error.message +
            '</div>';

    }

}


// ======================================
// 4. DISPLAY STOPS
// ======================================

function displayStops(list) {

    markers.clearLayers();

    const content = document.getElementById('content');

    content.innerHTML = `
        <div class="stop-list" id="stopList"></div>
    `;

    const stopList = document.getElementById('stopList');

    list.forEach(stop => {

        const marker = L.circleMarker(
            [
                Number(stop.stop_lat),
                Number(stop.stop_lon)
            ],
            {
                radius: 5,
                color: '#1675c5',
                weight: 2,
                fillColor: '#ffffff',
                fillOpacity: 1
            }
        );

        marker.bindTooltip(stop.stop_name);

        marker.on('click', () => {
            selectStop(stop);
        });

        marker.addTo(markers);

        const item = document.createElement('div');

        item.className = 'stop-item';

        const name = document.createElement('strong');
        name.textContent = stop.stop_name;

        const id = document.createElement('small');
        id.textContent = stop.stop_id;

        item.append(name, id);

        item.onclick = () => selectStop(stop);

        stopList.appendChild(item);

    });

}


// ======================================
// 5. SEARCH
// ======================================

document.getElementById('search').addEventListener(
    'input',
    function() {

        const query = this.value.toLowerCase();

        const filtered = stops.filter(s =>
            s.stop_name.toLowerCase().includes(query)
        );

        displayStops(filtered);

    }
);


// ======================================
// 6. TIME FUNCTIONS
// ======================================

function timeToSeconds(time) {

    const parts = time.split(':').map(Number);

    return (
        parts[0] * 3600 +
        parts[1] * 60 +
        (parts[2] || 0)
    );

}

function currentTimeSeconds() {

    const parts = new Intl.DateTimeFormat(
        'en-GB',
        {
            timeZone: 'Europe/Berlin',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hourCycle: 'h23'
        }
    ).format(new Date()).split(':').map(Number);

    return parts[0] * 3600 +
           parts[1] * 60 +
           parts[2];

}

function currentDate() {

    const parts = new Intl.DateTimeFormat(
        'en-CA',
        {
            timeZone: 'Europe/Berlin',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
        }
    ).formatToParts(new Date());

    const values = {};

    parts.forEach(p => {
        values[p.type] = p.value;
    });

    return values.year + values.month + values.day;

}

function formatTime(time) {

    const seconds = timeToSeconds(time);

    const h = Math.floor(seconds / 3600) % 24;
    const m = Math.floor(seconds % 3600 / 60);

    return String(h).padStart(2, '0') +
        ':' +
        String(m).padStart(2, '0');

}


// ======================================
// 7. ACTIVE SERVICES
// ======================================

function getActiveServices() {

    const date = currentDate();

    const today = new Date(
        Number(date.substring(0,4)),
        Number(date.substring(4,6))-1,
        Number(date.substring(6,8))
    );

    const weekday = today.getDay();

    const weekdayNames = [
        'sunday',
        'monday',
        'tuesday',
        'wednesday',
        'thursday',
        'friday',
        'saturday'
    ];

    const active = new Set();

    Object.values(calendar).forEach(c => {

        if (
            date >= c.start_date &&
            date <= c.end_date &&
            c[weekdayNames[weekday]] === '1'
        ) {
            active.add(c.service_id);
        }

    });

    const dayExceptions = exceptions[date] || {};

    Object.entries(dayExceptions).forEach(
        ([service, type]) => {

            if (type === 1) active.add(service);

            if (type === 2) active.delete(service);

        }
    );

    return active;

}


// ======================================
// 8. SELECT STOP
// ======================================

function selectStop(stop) {

    selectedStop = stop;

    map.flyTo(
        [
            Number(stop.stop_lat),
            Number(stop.stop_lon)
        ],
        16
    );

    showDepartures(stop);

}


// ======================================
// 9. DEPARTURES
// ======================================

function showDepartures(stop) {

    const content = document.getElementById('content');

    content.innerHTML = `
        <button class="back" id="backButton">
            ← Übersicht
        </button>

        <div class="panel-title">
            <h2>${escapeHTML(stop.stop_name)}</h2>
            <p>Haltestelle · ${escapeHTML(stop.stop_id)}</p>
        </div>

        <div class="departures" id="departureList">
            <div class="loading">Lade Abfahrten...</div>
        </div>
    `;

    document.getElementById('backButton').onclick = () => {
        selectedStop = null;
        displayStops(stops);
    };

    const activeServices = getActiveServices();

    const now = currentTimeSeconds();

    const times = stopTimes[stop.stop_id] || [];

    const departures = times.filter(t => {

        const trip = trips[t.trip_id];

        if (!trip) return false;

        if (!activeServices.has(trip.service_id)) {
            return false;
        }

        return timeToSeconds(t.departure_time) >= now;

    }).slice(0, 30);

    const list = document.getElementById('departureList');

    if (!departures.length) {

        list.innerHTML =
            '<p class="message">Keine weiteren Abfahrten für heute gefunden.</p>';

        return;

    }

    list.innerHTML = '';

    departures.forEach(d => {

        const trip = trips[d.trip_id];

        const route = routes[trip.route_id] || {};

        const item = document.createElement('div');

        item.className = 'departure';

        const badge = document.createElement('div');
        badge.className = 'route';
        badge.textContent = route.route_short_name || '?';

        const info = document.createElement('div');
        info.className = 'departure-info';

        const destination = document.createElement('strong');
        destination.textContent =
            d.stop_headsign ||
            trip.trip_headsign ||
            route.route_long_name ||
            'Unbekannt';

        const description = document.createElement('small');
        description.textContent = 'Fahrplanzeit · GTFS';

        info.append(destination, description);

        const time = document.createElement('div');
        time.className = 'departure-time';
        time.textContent = formatTime(d.departure_time);

        item.append(badge, info, time);

        list.appendChild(item);

    });

}


// ======================================
// 10. HTML SECURITY
// ======================================

function escapeHTML(value) {

    return String(value ?? '').replace(
        /[&<>"']/g,
        char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        })[char]
    );

}


// ======================================
// START
// ======================================

loadGTFS();

</script>

</body>
</html>
