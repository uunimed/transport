<!DOCTYPE html>
<html lang="ka" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fahrplan</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Supabase JS Client (For Favorite Stops Sync) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Google Fonts: Inter & Noto Sans Georgian -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans Georgian"', '"Inter"', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Noto Sans Georgian', 'Inter', sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    html { color-scheme: dark; }
    html.light { color-scheme: light; }

    /* Full Light Mode Theme Overrides */
    html.light body {
      background-color: #f8fafc !important;
      color: #0f172a !important;
    }
    html.light .bg-slate-950,
    html.light .bg-slate-950\/60,
    html.light .bg-slate-950\/70,
    html.light .bg-slate-950\/80,
    html.light .bg-slate-950\/90 {
      background-color: #f1f5f9 !important;
    }
    html.light .bg-slate-900,
    html.light .bg-slate-900\/95,
    html.light .bg-slate-900\/90 {
      background-color: #ffffff !important;
    }
    html.light .bg-slate-800,
    html.light .bg-slate-800\/90,
    html.light .bg-slate-800\/80,
    html.light .bg-slate-800\/60 {
      background-color: #e2e8f0 !important;
    }
    html.light .border-slate-800,
    html.light .border-slate-800\/90,
    html.light .border-slate-700,
    html.light .border-slate-700\/80,
    html.light .border-slate-700\/60 {
      border-color: #cbd5e1 !important;
    }
    html.light .text-white,
    html.light .text-slate-100,
    html.light .text-slate-200 {
      color: #0f172a !important;
    }
    html.light .text-slate-300,
    html.light .text-slate-400 {
      color: #475569 !important;
    }
    html.light #map {
      background: #e2e8f0 !important;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.25);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(59, 130, 246, 0.65);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(37, 99, 235, 0.9);
    }

    /* Settings Popup Window */
    .settings-popup-window {
      position: fixed;
      top: 1cm;
      bottom: 1cm;
      left: 2cm;
      right: 2cm;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 60;
    }
    @media (max-width: 640px) {
      .settings-popup-window {
        top: 0.5cm;
        bottom: 0.5cm;
        left: 0.5cm;
        right: 0.5cm;
      }
    }
    .settings-scroll-body {
      flex: 1;
      overflow-y: scroll;
      scrollbar-gutter: stable;
    }

    /* Map Container */
    #map {
      width: 100%;
      height: 100%;
      background: #050811;
      z-index: 1;
    }

    .map-tiles-dark .leaflet-tile-pane {
      filter: brightness(0.84) contrast(1.14) saturate(0.82);
    }

    /* Stop Marker Styles */
    .stop-marker-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stop-badge {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fef08a;
      border: 2px solid #16a34a;
      color: #15803d;
      font-weight: 800;
      font-size: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease;
    }
    .stop-badge:hover {
      transform: scale(1.3);
      z-index: 900 !important;
    }
    .stop-badge.selected {
      width: 28px;
      height: 28px;
      background: #2563eb;
      border: 2.5px solid #ffffff;
      color: #ffffff;
      font-size: 12px;
      box-shadow: 0 0 0 5px rgba(37, 99, 235, 0.35), 0 4px 14px rgba(0,0,0,0.7);
    }
    .stop-pulse-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid #3b82f6;
      animation: stopPulse 1.8s infinite ease-out;
      pointer-events: none;
    }
    @keyframes stopPulse {
      0% { transform: scale(0.75); opacity: 1; }
      100% { transform: scale(1.75); opacity: 0; }
    }

    /* Live Vehicle Marker Styles */
    .vehicle-marker-container {
      will-change: transform;
    }
    .vehicle-tooltip-heading { font-weight: 800; }
    .vehicle-tooltip-stops { display: flex; align-items: center; gap: .3rem; color: #60a5fa; }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* Animated Route Line */
    .animated-route-line {
      stroke-dasharray: 10, 10;
      animation: routeFlow 0.9s linear infinite;
    }
    @keyframes routeFlow {
      from { stroke-dashoffset: 20; }
      to { stroke-dashoffset: 0; }
    }

    /* Leaflet Tooltip Overrides */
    .leaflet-tooltip.custom-tooltip {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: #f8fafc;
      font-family: 'Noto Sans Georgian', 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }
    .departure-card {
      display: grid; grid-template-columns: minmax(5.4rem, auto) minmax(0, 1fr) auto; gap: .65rem;
      align-items: center; width: 100%; text-align: left; padding: .9rem .75rem;
      border-bottom: 1px solid var(--ui-border); background: transparent; color: var(--ui-ink);
    }
    .departure-card:hover, .departure-card:focus-visible { background: color-mix(in srgb, var(--ui-accent) 8%, transparent); }
    .departure-card.timing-late { background: color-mix(in srgb, #e05262 19%, transparent); }
    .departure-card.timing-early { background: color-mix(in srgb, #22a576 19%, transparent); }
    .departure-card.timing-late:is(:hover,:focus-visible) { background: color-mix(in srgb, #e05262 26%, transparent); }
    .departure-card.timing-early:is(:hover,:focus-visible) { background: color-mix(in srgb, #22a576 26%, transparent); }
    .departure-card.next-departure .departure-direction,
    .departure-card.next-departure [data-countdown]:not(.countdown-urgent,.departed-clock,.connection-countdown),
    .tracking-summary dd:not(.countdown-urgent,.departed-clock,.connection-countdown,.waiting-text) { color: var(--ui-positive); }
    .stopped-clock { color: var(--ui-positive); }
    .departed-clock { color: #fb7185; }
    html.light .departed-clock { color: #a61d33; }
    .stopped-clock, .approximate-clock, #trackConnection[data-kind="departure"] { animation: blinkDot .85s infinite; }
    .site-indicator { background: #34d399; }
    .site-indicator.has-issue { background: #ef4444; }
    #boardRefreshButton[data-state="loading"] svg { animation: board-refresh-spin 1s linear infinite; }
    @keyframes board-refresh-spin { to { transform: rotate(360deg); } }
    #boardRefreshButton[data-state="success"] { color: var(--ui-positive) !important; border-color: currentColor; }
    #boardRefreshButton[data-state="error"] { color: #ef4444 !important; border-color: currentColor; }
    .connection-countdown { position: relative; display: inline-block; overflow: hidden; vertical-align: bottom; min-height: 1.45em; }
    .connection-countdown:not([data-kind="departure"]) > span {
      position: absolute; left: 100%; top: 50%; white-space: nowrap;
      animation: connection-scroll 9s linear infinite;
    }
    @keyframes connection-scroll {
      from { left: 100%; transform: translateY(-50%); }
      to { left: 0; transform: translate(-100%, -50%); }
    }
    .tracking-summary.tracking-offline { grid-template-columns: minmax(0, 1fr); }
    .tracking-summary.tracking-offline > div:not(#trackConnection) { display: none; }
    #trackConnection { padding-inline: 0; min-height: 2.35rem; font-weight: 800; }
    #trackConnection[hidden] { display: none; }
    #trackConnection:not([data-kind="departure"]) > span { animation-duration: 13s; }
    #trackConnection[data-kind="layover"] { color: var(--ui-layover); }
    #trackConnection[data-kind="departure"]:not([data-overflow]) { text-align: center; }
    .approximate-clock { color: #fb7185 !important; }
    html.light .approximate-clock { color: #b4233d !important; }
    :root { --ui-layover: #d8b4fe; }
    html.light { --ui-layover: #6b21a8; }
    .event-time { color: var(--ui-positive); }
    .event-time.late, .connection-countdown { color: #fb7185; }
    html.light :is(.event-time.late, .connection-countdown) { color: #b4233d; }
    .route-step-meta del { color: var(--ui-muted); margin-inline-start: .35rem; }
    @media (prefers-reduced-motion: reduce) {
      .connection-countdown:not([data-kind="departure"]) > span { animation: none; left: 50%; transform: translate(-50%, -50%); }
      .stopped-clock, .approximate-clock, #trackConnection[data-kind="departure"], #boardRefreshButton[data-state="loading"] svg { animation: none; }
    }
    .departure-line { display: flex; align-items: center; gap: .35rem; white-space: nowrap; font-weight: 800; }
    .departure-main { min-width: 0; }
    .departure-direction { font-weight: 800; }
    [data-scroll-label] { display: block; min-width: 0; max-width: 100%; overflow: hidden; white-space: nowrap; text-align: start; }
    [data-scroll-label] > span { display: inline-block; width: max-content; white-space: nowrap; }
    [data-scroll-label].text-right:not([data-overflow]) { text-align: right; }
    [data-overflow] > span { animation: overflow-label-scroll var(--scroll-duration) linear infinite; }
    @keyframes overflow-label-scroll {
      0%, 15%, 100% { transform: translateX(0); }
      50%, 65% { transform: translateX(var(--scroll-offset)); }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-overflow] { text-overflow: ellipsis; }
      [data-overflow] > span { animation: none; display: inline; }
    }
    .departure-meta { display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; font-size: .72rem; margin-top: .35rem; }
    .departure-chip { color: var(--ui-muted); font-weight: 700; }
    .departure-chip::before { content: '·'; margin-inline: .15rem .35rem; color: var(--ui-muted); }
    .departure-chip.good { color: #34d399; }
    .departure-chip.warn { color: #fbbf24; }
    .departure-chip.error { color: #fda4af; }
    .departure-count { width: clamp(5rem, 24vw, 7rem); text-align: right; font-weight: 800; white-space: nowrap; }
    .departure-count small { display: block; color: #60a5fa; font-size: .65rem; margin-top: .3rem; }
    .departure-count .on-map { color: #34d399; }
    html.light .departure-count small { color: #1d4ed8; }
    html.light .departure-count .on-map { color: #047857; }
    .tracking-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .4rem; }
    .tracking-summary > div { border: 1px solid #475569; border-radius: .65rem; padding: .3rem .3rem; text-align: center; }
    .tracking-summary dt { font-size: .65rem; opacity: .85; }
    .tracking-summary dd { font-size: .9rem; font-weight: 800; margin-top: .1rem; }
    @media (max-width: 420px) {
      .departure-card { grid-template-columns: auto minmax(0, 1fr) auto; gap: .4rem; padding: .65rem .45rem; }
      .departure-line { font-size: .78rem; gap: .2rem; }
      .departure-count { font-size: .78rem; }
      .departure-count small { font-size: .55rem; }
    }

    :root {
      --ui-surface: #111c2d; --ui-raised: #19273c; --ui-ink: #f0f5fb; --ui-muted: #a9b8cc;
      --ui-border: #34465f; --ui-accent: #82bbff; --ui-positive: #56e4aa;
    }
    html.light {
      --ui-surface: #fff; --ui-raised: #edf4fc; --ui-ink: #17263b; --ui-muted: #475b74;
      --ui-border: #c8d7e8; --ui-accent: #145bb8; --ui-positive: #047550;
    }
    html.light :is(.text-slate-500,.text-slate-400,.text-slate-300,.placeholder-slate-400) { color: var(--ui-muted) !important; }
    html.light :is(.text-blue-300,.text-blue-400):not(.brand-tram) { color: var(--ui-accent) !important; }
    html.light :is(.text-emerald-300,.text-emerald-400) { color: var(--ui-positive) !important; }
    html.light .text-amber-300 { color: #854400 !important; }
    html.light :is(.bg-blue-600,.bg-blue-500,.bg-rose-600,.bg-emerald-600).text-white { color: #fff !important; }
    html.light .departure-chip.good { color: #075b3f; }
    html.light .departure-chip.warn { color: #794500; }
    html.light .departure-chip.error { color: #99263b; }
    html.light .leaflet-tooltip.custom-tooltip { background: #fff; color: #17263b; border-color: #a6bbd4; }
    html.light .vehicle-tooltip-stops { color: #145bb8; }
    html.light .departure-line { color: color-mix(in srgb, var(--line-color), #101820 25%) !important; }
    html.light .hover\:bg-slate-800:hover { background-color: #dfeafb !important; }

    .settings-panel { border: 1px solid var(--ui-border); background: var(--ui-surface); border-radius: 1rem; padding: 1rem; }
    #confirmStartupStop:disabled { opacity: .42; cursor: default; }
    .transport-toggle {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .45rem;
      min-height: 5rem; padding: .55rem .3rem; text-align: center; font-size: .75rem; font-weight: 750;
      background: var(--ui-surface); color: var(--ui-muted); border: 1px solid var(--ui-border); border-radius: .8rem;
    }
    .transport-toggle-icon svg { width: 1.65rem; height: 1.65rem; }
    .transport-toggle[aria-pressed="true"] {
      color: var(--ui-ink); border-color: var(--transport-color);
      background: color-mix(in srgb, var(--ui-surface), var(--transport-color) 16%);
    }
    .transport-toggle[aria-pressed="true"] .transport-toggle-icon { color: var(--transport-color); }
    #typeToggle-tram { --transport-color: #ee555c; }
    #typeToggle-bus { --transport-color: #8b5cf6; }
    #typeToggle-suburban { --transport-color: #0da678; }
    #typeToggle-regional { --transport-color: #4281e9; }

    .vehicle-label {
      --map-halo: #101a2c; display: inline-flex; align-items: center; width: max-content;
      gap: .3rem; color: #fff; font-size: 12px; font-weight: 850;
      transform: translate(-16px, -50%);
    }
    .vehicle-label svg {
      width: 30px; height: 20px; color: var(--vehicle-color);
      filter: drop-shadow(1px 0 var(--map-halo)) drop-shadow(-1px 0 var(--map-halo)) drop-shadow(0 1px var(--map-halo));
    }
    .vehicle-label span { paint-order: stroke fill; -webkit-text-stroke: 3px var(--map-halo); }
    .vehicle-label:hover { transform: translate(-16px, -50%) scale(1.08); }
    html.light .vehicle-label { --map-halo: #fff; color: #17263b; }
    .departure-line .transport-side-icon { width: 1.6rem; height: 1rem; }

    .countdown-urgent { color: #fb7185; }
    html.light .countdown-urgent { color: #b4233d; }
    .countdown-urgent, .waiting-text { animation: blinkDot .85s infinite; }
    .waiting-text { color: #fb7185 !important; font-weight: 700; }
    html.light .waiting-text { color: #a51f39 !important; }
    #trackStopsTimeline { padding: .3rem .9rem .9rem; }
    .route-steps { padding: .25rem 0; }
    .route-step {
      position: relative; display: grid; grid-template-columns: 1rem minmax(0,1fr) auto;
      align-items: start; gap: .55rem; padding: .5rem .1rem; min-height: 2.3rem;
      color: var(--ui-ink);
    }
    .route-step:not(:last-child)::after {
      content: ''; position: absolute; top: 1.15rem; bottom: -.65rem;
      left: .53rem; width: 2px; background: var(--ui-border);
    }
    .route-node {
      z-index: 1; position: relative; margin: .18rem auto 0;
      width: .6rem; height: .6rem; border: 2px solid var(--ui-muted); border-radius: 50%;
      background: var(--ui-surface);
    }
    .route-step.current { color: var(--ui-positive); font-weight: 800; }
    .route-step.current .route-node { border-color: var(--ui-positive); background: var(--ui-positive); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ui-positive), transparent 78%); }
    .route-step.target { color: var(--ui-accent); }
    .route-step.target .route-node { border-color: var(--ui-accent); }
    .route-step.passed { opacity: .5; }
    .route-step.passed :is(.route-stop-name,time) { text-decoration: line-through; }
    .route-step-meta { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .route-step-meta small, .route-note { display: flex; align-items: center; justify-content: flex-end; gap: .2rem; font-size: .64rem; }
    .route-note { justify-content: flex-start; color: var(--ui-accent); margin-top: .18rem; }
    .route-step-meta small:empty { display: none; }
    .route-step-main { overflow-wrap: anywhere; }
    .journey-stops { padding-left: .85rem; }
    .journey-step { position: relative; margin-left: .45rem; padding: .55rem .65rem .55rem 1.15rem; border-left: 1px solid var(--ui-border); color: var(--ui-ink); }
    .journey-step::before { position: absolute; left: -.28rem; top: .85rem; width: .55rem; height: .55rem; content: ''; border: 1px solid var(--ui-muted); background: var(--ui-surface); border-radius: 50%; }
    .journey-step.next { background: var(--ui-raised); border-left: 2px solid var(--ui-positive); border-radius: 0 .65rem .65rem 0; font-weight: 800; }
    .journey-step.passed { opacity: .52; text-decoration: line-through; }
    .vehicle-marker-container.vehicle-muted { pointer-events: none; }
    .journey-time-range, .journey-summary { display: inline-flex; align-items: center; gap: .3rem; }
    .journey-summary { flex-wrap: wrap; }
    .journey-time-range svg, .transfer-stops svg, .through-line strong svg { color: var(--ui-accent); flex-shrink: 0; display: inline-block; vertical-align: middle; }
    .journey-transfer-card { display: grid; grid-template-columns: 1.45rem minmax(0, 1fr); gap: .55rem; padding: .65rem .8rem; margin-left: .4rem; border-left: 2px solid var(--ui-accent); background: var(--ui-raised); color: var(--ui-ink); font-size: .74rem; }
    .journey-transfer-card p { margin-top: .18rem; }
    .transfer-stops { color: var(--ui-accent); }
    .transfer-arrow { display: grid; place-items: center; width: 1.45rem; height: 1.45rem; border-radius: 50%; background: var(--ui-surface); color: var(--ui-accent); }
    .transfer-short { border-color: #e05267; }
    .journey-form, .journey-card, .journey-leg, .journey-detail-header {
      background: var(--ui-surface); color: var(--ui-ink); border: 1px solid var(--ui-border);
      border-radius: .9rem; padding: .8rem;
    }
    .journey-form { display: grid; gap: .55rem; }
    .journey-form label { display: block; font-size: .75rem; color: var(--ui-muted); margin-bottom: .25rem; }
    .journey-form :is(input,select) { width: 100%; color: var(--ui-ink); background: var(--ui-raised); border: 1px solid var(--ui-border); border-radius: .55rem; padding: .45rem .6rem; font-size: .85rem; }
    .journey-primary, .journey-secondary { border: 1px solid var(--ui-border); border-radius: .55rem; padding: .45rem .65rem; font-size: .77rem; font-weight: 750; }
    .journey-primary { color: #fff; background: #1d5cc2; border-color: #1d5cc2; }
    .journey-secondary { color: var(--ui-accent); background: var(--ui-raised); }
    .journey-primary:disabled { opacity: .45; }
    .stop-picker { position: absolute; top: 100%; inset-inline: 0; z-index: 15; margin-top: .15rem; background: var(--ui-surface); color: var(--ui-ink); border: 1px solid var(--ui-border); border-radius: .6rem; padding: .15rem; }
    .stop-picker-option { display: flex; justify-content: space-between; gap: .4rem; width: 100%; text-align: left; padding: .5rem; font-size: .75rem; }
    .stop-picker-option:hover, .stop-picker-option:focus-visible { background: var(--ui-raised); }
    .stop-picker-option small, .journey-muted { color: var(--ui-muted); }
    .journey-card { display: grid; gap: .25rem; width: 100%; text-align: left; }
    .journey-card:hover { background: var(--ui-raised); border-color: var(--ui-accent); }
    .journey-transfer { color: var(--ui-accent); font-weight: 750; font-size: .75rem; }
    .journey-step.next { font-size: 1.05em; }
    .journey-step.next::before { background: var(--ui-positive); border-color: var(--ui-positive); }
    @media (prefers-reduced-motion: reduce) {
      .countdown-urgent, .waiting-text { animation: none; }
    }
    .brand-tram { color: #7dd3fc; }
    html.light .brand-tram { color: #145bb8; }
    .settings-symbol { background: transparent; border: 0; box-shadow: none; color: var(--ui-accent); padding: .45rem; border-radius: 50%; }
    .settings-symbol:hover { color: var(--ui-ink); }
    .settings-symbol svg { width: 1.3rem; height: 1.3rem; }
    .departure-card[hidden] { display: none; }
    .journey-origin { position: relative; }
    .journey-origin input { padding-right: 2.3rem; }
    #journeyUseLocation { position: absolute; right: .4rem; top: 50%; transform: translateY(-50%); color: var(--ui-accent); padding: .2rem; }
    #journeyUseLocation:disabled { opacity: .5; }
    .journey-result-legs { display: flex; align-items: center; flex-wrap: wrap; gap: .35rem; }
    .journey-result-legs svg { color: var(--ui-accent); flex-shrink: 0; }
    .walk-link {
      display: grid; grid-template-columns: minmax(4.4rem, .72fr) 2rem minmax(0, 1.8fr);
      grid-template-rows: auto minmax(3rem,auto) auto; column-gap: .25rem; align-items: center;
      padding: .2rem 0; margin-left: -.25rem; color: var(--ui-ink);
    }
    .walk-link .walk-label { grid-column: 1; grid-row: 1; text-align: right; font-size: .73rem; color: var(--ui-muted); }
    .walk-link .walk-info { grid-column: 1; grid-row: 2; text-align: right; font-size: .72rem; line-height: 1.45; }
    .walk-link .walk-info p + p { margin-top: .12rem; }
    .walk-link .walk-curve { grid-column: 2; grid-row: 1 / 4; width: 100%; height: 100%; color: var(--ui-accent); }
    .walk-link .walk-stop { grid-column: 3; display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: baseline; gap: .4rem; font-size: .82rem; overflow-wrap: anywhere; }
    .walk-link .walk-stop time { white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 750; }
    .walk-link .walk-from { grid-row: 1; }
    .walk-link .walk-to { grid-row: 3; }
    .walk-link :is(.walk-from,.walk-to).passed { opacity: .55; text-decoration: line-through; }
    .walk-link :is(.walk-from,.walk-to).next { color: var(--ui-positive); font-weight: 800; }
    .walk-link .walk-eta { color: var(--ui-accent); font-weight: 750; }
    .vehicle-tooltip-heading { display: flex; align-items: center; gap: .25rem; }
    .journey-date-fields { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; }
    .journey-clock-input { text-align: center; font-variant-numeric: tabular-nums; }
    .stop-cluster { display: grid; place-items: center; width: 100%; height: 100%; border: 2px solid #b9f3d6;
      border-radius: 50%; background: #0b6249; color: #fff; font-size: 11px; font-weight: 800; box-shadow: 0 2px 8px #0007; }
    .stop-cluster-options { display: grid; gap: .3rem; max-height: 14rem; overflow-y: auto; }
    .stop-cluster-options button { padding: .3rem; text-align: left; }
  </style>
</head>

    async function safeFetchJSON(url, timeoutMs = 4500, body = null) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, {
          signal: controller.signal,
          headers: { 'Accept': 'application/json', ...(body ? { 'Content-Type': 'application/json' } : {}) },
          ...(body ? { method: 'POST', body: JSON.stringify(body) } : {})
        });
        if (!res.ok) return null;
        return await res.json();
      } catch {
        return null;
      } finally {
        clearTimeout(timer);
      }
    }

    const vmsApi = 'https://webapi.vvo-online.de';
    const vmsHubStops = [
      { id: '30131', operatorId: '36030131', location: [50.8317, 12.9222] },
      { id: '30263', operatorId: '36030263', location: [50.8090, 12.8930] }
    ];
    const vmsStationRequests = new Map();
    const vmsStationIds = new Map(vmsHubStops.map(stop => [stop.id, stop.operatorId]));

    function fetchVmsDepartures(stationId, force = false) {
      if (!stationId) return Promise.resolve([]);
      const now = Date.now();
      const cached = vmsStationRequests.get(stationId);
      if (!force && cached && now - cached.time < REFRESH_MS) return cached.promise;
      const promise = (async () => {
        let id = vmsStationIds.get(stationId);
        if (!id) {
          const ifopt = encodeURIComponent(`de:14511:${stationId}`);
          const lookup = await safeFetchJSON(`${vmsApi}/tr/pointfinder?query=${ifopt}&stopsOnly=true&format=json`, 6500);
          const matches = (Array.isArray(lookup?.Points) ? lookup.Points : [])
            .map(point => String(point).split('|')).filter(([number, type, city]) =>
              /^\d+$/.test(number) && !type && city === 'Chemnitz');
          if (matches.length !== 1) return [];
          id = matches[0][0];
          vmsStationIds.set(stationId, id);
        }
        const data = await safeFetchJSON(`${vmsApi}/dm?format=json`, 7000, { stopid: id, limit: 40 });
        return data?.Place === 'Chemnitz' ? LiveTransit.vmsDepartures(data) : [];
      })();
      if (vmsStationRequests.size >= 24) vmsStationRequests.delete(vmsStationRequests.keys().next().value);
      vmsStationRequests.set(stationId, { time: now, promise });
      return promise;

      const showStop = async (stop, prefix) => {
        if (selectedStop !== previousStop) return;
        document.getElementById('activeAreaSubtitle').textContent = `${prefix}: ${stop.name}`;
        map.setView(stopLatLng(stop), 15);
        await selectStop(stop, false);
      };
      const useSavedStop = () => customStop && showStop(customStop, 'საწყისი');
      if (!navigator.geolocation) {
        if (manualClick) showToast('მდებარეობა მიუწვდომელია.');
        await useSavedStop();
        return;
      }

      if (manualClick) showToast('მუშავდება');

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;

          renderUserLocation(pos.coords);

          if (markerOnly) {
            map.fitBounds(locationAccuracy.getBounds(), { maxZoom: 16, padding: [35, 35] });
            return;
          }

          if (selectedStop !== previousStop) return;
          if (customStop && haversineMeters(lat, lng, ...stopLatLng(customStop)) <= STARTUP_STOP_RADIUS_METERS) {
            await useSavedStop();
            return;
          }
          const nearby = await safeFetchJSON(`${TRANSITOUS_BASE}/api/v1/map/stops?min=${lat-0.02},${lng-0.035}&max=${lat+0.02},${lng+0.035}`);
          if (selectedStop !== previousStop) return;
          let closest = null;
          let minDist = Infinity;
          for (const stop of Array.isArray(nearby) ? nearby : []) {
            if (!stop.stopId || ![stop.lat, stop.lon].every(Number.isFinite)) continue;
            const distance = haversineMeters(lat, lng, stop.lat, stop.lon);
            if (distance < minDist) {
              closest = stop;
              minDist = distance;
            }
          }
          if (closest) {
            const platform = closest.track || closest.scheduledTrack;
            await showStop({ id: closest.stopId, name: closest.name, platform, platformOnly: true,
              platformLabel: LiveTransit.platformLabel(closest),
              location: { latitude: closest.lat, longitude: closest.lon } }, 'უახლოესი');
          } else {
            map.setView([lat, lng], 15);
            document.getElementById('activeAreaSubtitle').textContent = 'მიმდინარე ლოკაცია';
          }
        },
        async () => {
          if (manualClick) showToast('შეამოწმე ნებართვები');
          await useSavedStop();
        },
        { enableHighAccuracy: !markerOnly, timeout: 10000, maximumAge: 30000 }
      );
    }

    /*************************************************************************
     * 6. REFRESH MAP VIEW
     *************************************************************************/
    let manualRefreshPending = false;
    let refreshLabelTimer;
    function finishManualRefresh(label) {
      if (!manualRefreshPending) return;
      manualRefreshPending = false;
      const button = document.getElementById('mapRefreshButton');
      const status = document.getElementById('mapRefreshLabel');
      button.removeAttribute('aria-busy');
      status.textContent = label;
      refreshLabelTimer = setTimeout(() => { status.textContent = 'განახლება'; }, 4000);
    }

    function refreshMapManually() {
      clearTimeout(refreshLabelTimer);
      manualRefreshPending = true;
      document.getElementById('mapRefreshButton').setAttribute('aria-busy', 'true');
      document.getElementById('mapRefreshLabel').textContent = 'ახლდება…';
      if (selectedStop) refreshSelectedStopDepartures(true);
      if (trackedTripId) refreshTrackedTrip();
      if (map.getZoom() < 11) map.setZoom(11);
      refreshMapViewData();
    }

    async function refreshMapViewData() {
      const request = ++viewportRequest;
      const zoom = map.getZoom();
      const spinner = document.getElementById('scanSpinner');
      if (zoom < 11) {
        renderMapStops();
        updateLiveMarkers();
        spinner.classList.remove('animate-spin');
        finishManualRefresh('გაზარდე რუკის მასშტაბი');
        return;
      }

      spinner.classList.add('animate-spin');
      const bounds = map.getBounds();
      const area = `min=${bounds.getSouth().toFixed(4)},${bounds.getWest().toFixed(4)}&max=${bounds.getNorth().toFixed(4)},${bounds.getEast().toFixed(4)}`;
      const wider = bounds.pad(.35);
      const vehicleArea = `min=${wider.getSouth().toFixed(4)},${wider.getWest().toFixed(4)}&max=${wider.getNorth().toFixed(4)},${wider.getEast().toFixed(4)}`;
      const now = Date.now();
      const stationIds = new Set(vmsHubStops.filter(stop => wider.contains(stop.location)).map(stop => stop.id));
      const selectedStation = LiveTransit.chemnitzStationId(selectedStop?.id);
      if (selectedStation) stationIds.add(selectedStation);
      const vmsUpdates = Promise.all([...stationIds].map(async id => [id, await fetchVmsDepartures(id)]));
      const windowMs = LiveTransit.MAP_TRIP_WINDOW_MS;
      const time = `startTime=${new Date(now - windowMs).toISOString()}&endTime=${new Date(now + windowMs).toISOString()}`;
      const fetchTrips = async () => {
        const primary = await safeFetchJSON(`${TRANSITOUS_BASE}/api/v5/map/trips?${vehicleArea}&${time}&zoom=${zoom}`, 11_000);
        if (Array.isArray(primary) || request !== viewportRequest) return primary;
        return safeFetchJSON(`${TRANSITOUS_BASE}/api/v6/map/trips?${area}&${time}&zoom=${zoom}`, 10_000);
      };
      const [stops, segments, positionData, stations] = await Promise.all([
        safeFetchJSON(`${TRANSITOUS_BASE}/api/v1/map/stops?${area}`, 11_000),
        fetchTrips(),
        VEHICLE_POSITIONS_URL ? safeFetchJSON(`${VEHICLE_POSITIONS_URL}?${area}`) : null,
        vmsUpdates
      ]);
      if (request !== viewportRequest) return;
      mapConnectionIssue = !Array.isArray(segments);
      mapStopsIssue = !Array.isArray(stops);
      updateSiteIndicator();

      if (Array.isArray(stops)) {
        viewportStops = stops.filter(st => st.stopId && Number.isFinite(st.lat) && Number.isFinite(st.lon)).map(st => ({
          id: st.stopId, name: st.name, platform: st.track || st.scheduledTrack, platformLabel: LiveTransit.platformLabel(st),
          location: { latitude: st.lat, longitude: st.lon }
        }));
        renderMapStops();
      }

      if (Array.isArray(segments)) {
        const boardTripIds = new Set(currentDepartures.filter(dep => !dep.cancelled && !dep.skipped).map(dep => dep.tripId));
        latestMapSegments = LiveTransit.applyVmsMapTimes(segments, stations, now);
        activeTripsCache = LiveTransit.mergeMapTrips(activeTripsCache, latestMapSegments, now, boardTripIds);
        tripsFetchedAt = now;
      }
      if (Array.isArray(positionData?.vehicles)) {
        liveVehiclesState = LiveTransit.vehiclePositions(positionData.vehicles, Date.now());
      }
      updateLiveMarkers();
      spinner.classList.remove('animate-spin');
      finishManualRefresh(Array.isArray(stops) && Array.isArray(segments) ? 'განახლდა' : 'განახლება ვერ მოხერხდა');
    }

    function stopLatLng(stop) {
      return [stop.location.latitude, stop.location.longitude];
    }

    function renderMapStops() {
      if (!map || !stopsLayerGroup) return;
      const zoom = map.getZoom();
      const bounds = map.getBounds().pad(.12);
      const selectedId = selectedStop?.id;
      const groups = new Map();
      if (zoom >= 11) {
        const stops = new Map(viewportStops.map(stop => [stop.id, stop]));
        if (selectedStop?.location && !stops.has(selectedId)) stops.set(selectedId, selectedStop);
        for (const stop of stops.values()) {
          const coordinates = stopLatLng(stop);
          if (!bounds.contains(coordinates)) continue;
          const point = map.project(coordinates, zoom);
          const size = zoom < 14 ? 100 : zoom < 17 ? 78 : 50;
          const key = stop.id === selectedId ? 'selected:' + stop.id : zoom >= 19
            ? coordinates.map(value => value.toFixed(6)).join(',')
            : `${Math.floor(point.x / size)}:${Math.floor(point.y / size)}`;
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(stop);
        }
      }
      const signature = JSON.stringify([zoom, selectedId,
        [...groups.values()].map(group => group.map(stop => [stop.id, ...stopLatLng(stop)]))]);
      if (signature === stopLayerSignature) return;
      stopLayerSignature = signature;
      stopsLayerGroup.clearLayers();
      for (const group of groups.values()) {
        if (group.length === 1) createStopMarker(group[0]).addTo(stopsLayerGroup);
        else createStopCluster(group, zoom).addTo(stopsLayerGroup);
      }
    }

    function createStopMarker(stop) {
      const isSelected = selectedStop?.id === stop.id;
      const size = isSelected ? 30 : 26;
      const icon = L.divIcon({
        className: 'stop-marker-wrap',
        html: `<div id="stop-badge-${escapeHTML(stop.id)}" class="stop-badge ${isSelected ? 'selected' : ''}">
          ${isSelected ? '<div class="stop-pulse-ring"></div>' : ''}H</div>`,
        iconSize: [size, size], iconAnchor: [size / 2, size / 2]
      });
      const label = stop.platformLabel ? `${stop.name} · ბაქანი ${stop.platformLabel}` : stop.name;
      const marker = L.marker(stopLatLng(stop), { icon, title: label, zIndexOffset: isSelected ? 200 : 0 });
      marker.bindTooltip(escapeHTML(label), { direction: 'top', offset: [0, -10], className: 'custom-tooltip' });
      marker.on('click', () => selectStop({ ...stop, platformOnly: true }, true));
      return marker;
    }

    function createStopCluster(stops, zoom) {
      const bounds = L.latLngBounds(stops.map(stopLatLng));
      const count = stops.length;
      const label = `${count} გაჩერება`;
      const size = count > 99 ? 40 : count > 9 ? 35 : 30;
      const marker = L.marker(bounds.getCenter(), {
        title: label,
        icon: L.divIcon({ className: 'stop-cluster-wrap',
          html: `<span class="stop-cluster" aria-label="${label}">${count}</span>`,
          iconSize: [size, size], iconAnchor: [size / 2, size / 2] })
      });
      if (zoom < 19) {
        marker.on('click', () => {
          const padding = L.point(72, 72);
          const nextZoom = Math.min(19, zoom + 3, Math.max(zoom + 1, map.getBoundsZoom(bounds, false, padding)));
          map.setView(bounds.getCenter(), nextZoom);
        });
      } else {
        const options = document.createElement('div');
        options.className = 'stop-cluster-options';
        for (const stop of stops) {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = stop.platformLabel ? `${stop.name} · ბაქანი ${stop.platformLabel}` : stop.name;
          button.addEventListener('click', () => {
            map.closePopup();
            selectStop({ ...stop, platformOnly: true }, true);
          });
          options.append(button);
        }
        marker.bindPopup(options);
      }
      return marker;
    }

    /*************************************************************************
     * 7. SELECT STOP & FETCH LIVE DEPARTURES
     *************************************************************************/
    async function selectStop(stop, panToStop = true) {
      selectedStop = stop;
      const subtitle = document.getElementById('activeAreaSubtitle');
      if (subtitle.textContent === 'მუშავდება') subtitle.textContent = '';
      renderMapStops();

      if (panToStop && stop.location) {
        const coordinates = [stop.location.latitude, stop.location.longitude];
        if (map.getZoom() < 11) map.setView(coordinates, 15);
        else map.panTo(coordinates, { animate: true });
      }

      if (trackedTripId) clearTrackedTrip(false);
      switchSidebarTab('departures');

      document.getElementById('boardEmpty').classList.add('hidden');
      document.getElementById('boardHeader').classList.remove('hidden');
      document.getElementById('departuresList').classList.remove('hidden');
      document.getElementById('selectedStopTitle').textContent = stop.name;
      showSelectedPlatform(stop.platformOnly ? stop.platformLabel ?? LiveTransit.platformLabel({ track: stop.platform }) : null);
      updateFavoriteButtonUI();

      await refreshSelectedStopDepartures(false);
    }

    function showSelectedPlatform(platform) {
      document.getElementById('selectedStopPlatform').textContent = platform ? `ბაქანი ${platform}` : '';
    }

    function boardEvents(data, stop) {
      if (!Array.isArray(data?.stopTimes)) return null;
      return data.stopTimes.filter(event => event?.place &&
        (!stop.platformOnly || belongsToBoard(event.place, stop)));
    }

    const fallbackTripCache = new Map();

    function belongsToBoard(place, stop) {
      if (!place) return false;
      if (place.stopId === stop.id || (!stop.platformOnly && place.parentId === stop.id)) return true;
      // A complete platform DHID remains stable when the data-provider prefix changes.
      const platformId = value => String(value ?? '').match(/(?:^|_)(de:[0-9]+:[^:]+:[^:]*:[^:]+)$/)?.[1];
      const selected = platformId(stop.id);
      if (selected && selected === platformId(place.stopId)) return true;
      if (!stop.location || ![place.lat, place.lon].every(Number.isFinite)) return false;
      const name = value => String(value ?? '').normalize('NFC').trim().toLocaleLowerCase('de-DE');
      const track = place.track ?? place.scheduledTrack;
      if (!stop.platform || !track || name(track) !== name(stop.platform) || name(place.name) !== name(stop.name)) return false;
      return haversineMeters(...stopLatLng(stop), place.lat, place.lon) <= 20;
    }

    function boardEventsFromSegments(trips, stop, now) {
      const events = [];
      const lower = now - 8000, upper = now + 15 * 60_000;
      for (const [tripId, trip] of trips) {
        if (now - trip.fetchedAt > LiveTransit.MAX_POSITION_AGE_MS) continue;
        const outgoing = trip.legs.find(leg => leg.departure >= lower && leg.departure <= upper &&
          !leg.from?.cancelled && leg.from?.pickupType !== 'NOT_ALLOWED' && belongsToBoard(leg.from, stop));
        const incoming = trip.legs.find(leg => leg.arrival >= lower && leg.arrival <= upper &&
          !leg.to?.cancelled && belongsToBoard(leg.to, stop));
        const leg = outgoing ?? incoming;
        if (!leg) continue;
        const place = outgoing ? outgoing.from : incoming.to;
        const arrival = incoming?.arrival;
        const departure = outgoing?.departure;
        events.push({
          tripId, displayName: trip.line.name, mode: trip.line.product, headsign: trip.direction,
          realTime: true, arrivalOnly: !outgoing,
          place: { ...place, arrival: incoming ? new Date(arrival).toISOString() : undefined,
            departure: outgoing ? new Date(departure).toISOString() : undefined,
            arrivalTimestampReason: incoming ? 'PREDICTED' : undefined,
            departureTimestampReason: outgoing ? 'PREDICTED' : undefined }
        });
      }
      return events;
    }

    async function boardFromNearbyTrips(stop, now) {
      if (!stop.location) return [];
      const selected = stopLatLng(stop);
      function nearbyCandidates(trips) {
        const candidates = [];
        for (const [id, trip] of trips) {
          const relevant = trip.legs.filter(leg => leg.arrival >= now - 25000 && leg.departure <= now + 360_000);
          const matched = relevant.some(leg => belongsToBoard(leg.from, stop) || belongsToBoard(leg.to, stop));
          const meters = Math.min(...relevant.flatMap(leg => [leg.from, leg.to])
            .filter(place => Number.isFinite(place?.lat) && Number.isFinite(place?.lon))
            .map(place => haversineMeters(...selected, place.lat, place.lon)));
          if (matched || meters < 1500) candidates.push({ id, rank: matched ? -1 : meters });
        }
        return candidates;
      }
      let trips = now - tripsFetchedAt <= LiveTransit.MAX_POSITION_AGE_MS ? activeTripsCache : new Map();
      let candidates = nearbyCandidates(trips);
      if (!candidates.length) {
        const [lat, lon] = selected;
        const area = `min=${lat - .02},${lon - .025}&max=${lat + .02},${lon + .025}`;
        const time = `startTime=${new Date(now - 120_000).toISOString()}&endTime=${new Date(now + 120_000).toISOString()}`;
        const data = await safeFetchJSON(`${TRANSITOUS_BASE}/api/v5/map/trips?${area}&${time}&zoom=15`, 5000);
        if (Array.isArray(data)) {
          trips = LiveTransit.mapTrips(data, now);
          candidates = nearbyCandidates(trips);
        }
      }
      candidates.sort((a, b) => a.rank - b.rank);
      const responses = await Promise.all(candidates.slice(0, 4).map(async ({ id }) => {
        const cached = fallbackTripCache.get(id);
        if (cached && now - cached.time < 60_000) return cached.legs;
        const data = await safeFetchJSON(`${TRANSITOUS_BASE}/api/v5/trip?tripId=${encodeURIComponent(id)}&joinInterlinedLegs=false`, 5000);
        const legs = Array.isArray(data?.legs) ? data.legs : [];
        if (fallbackTripCache.size >= 30) fallbackTripCache.delete(fallbackTripCache.keys().next().value);
        fallbackTripCache.set(id, { time: now, legs });
        return legs;
      }));
      const events = new Map(boardEventsFromSegments(trips, stop, now).map(event => [event.tripId, event]));
      for (const leg of responses.flat()) {
        for (const place of [leg.from, ...(leg.intermediateStops ?? [])]) {
          const departure = Date.parse(place?.departure ?? place?.scheduledDeparture);
          if (!belongsToBoard(place, stop) || place.cancelled || leg.cancelled ||
              place.pickupType === 'NOT_ALLOWED' || !Number.isFinite(departure) ||
              departure < now - 8000 || departure > now + 3_600_000) continue;
          const key = leg.tripId;
          events.set(key, { ...leg, place,
            realTime: LiveTransit.hasLiveTime(place.departureTimestampReason), tripCancelled: false });
        }
      }
      return [...events.values()].sort((a, b) => Date.parse(a.place.departure) - Date.parse(b.place.departure));
    }

    function updateSiteIndicator() {
      const connectionIssue = browserOffline() || mapConnectionIssue || mapStopsIssue ||
        Boolean(selectedStop && (boardConnectionIssue || boardPaging?.error)) ||
        Boolean(trackedTripId && trackedConnectionIssue);
      const indicator = document.getElementById('siteIndicator');
      const label = connectionIssue ? connectionText : pageRuntimeIssue ? 'გვერდის ხარვეზი' : 'მონაცემები ხელმისაწვდომია';
      indicator.classList.toggle('has-issue', connectionIssue || pageRuntimeIssue);
      indicator.setAttribute('aria-label', label);
      indicator.title = label;
    }

    async function refreshBoardManually() {
      const stop = selectedStop;
      if (!stop || manualBoardStop) return;
      const button = document.getElementById('boardRefreshButton');
      clearTimeout(manualBoardFeedbackTimer);
      manualBoardStop = stop;
      button.disabled = true;
      button.dataset.state = 'loading';
      button.title = 'იტვირთება';
      button.setAttribute('aria-busy', 'true');
      let refreshed = false;
      try {
        refreshed = await refreshSelectedStopDepartures(false);
      } finally {
        manualBoardStop = null;
        button.disabled = false;
        button.removeAttribute('aria-busy');
        button.dataset.state = selectedStop !== stop ? '' : refreshed ? 'success' : 'error';
        button.title = selectedStop !== stop ? 'განახლება' : refreshed ? 'განახლდა' : 'განახლება ვერ მოხერხდა';
        manualBoardFeedbackTimer = setTimeout(() => {
          delete button.dataset.state;
          button.title = 'განახლება';
        }, 3000);
        updateSiteIndicator();
      }
    }

    async function refreshSelectedStopDepartures(silent = false) {
      const stop = selectedStop;
      if (!stop || (silent && manualBoardStop === stop)) return;
      const request = ++departuresRequest;
      if (boardPaging?.stop !== stop) {
        boardConnectionIssue = false;
        boardPaging = { stop, limit: BOARD_PAGE_SIZE, head: [], tail: new Map(), cursors: new Set(),
          atStop: new Map(), departed: new Map() };
        currentDepartures = [];
        stopAlerts = [];
        departuresStatus = 'იტვირთება';
        departuresNote = '';
        document.getElementById('lastUpdatedTime').textContent = '';
        renderDeparturesList();
      }
      const paging = boardPaging;
      const now = Date.now();
      if (browserOffline()) {
        boardConnectionIssue = true;
        if (currentDepartures.length) updateDepartureCountdowns();
        else {
          departuresStatus = connectionText;
          renderDeparturesList();
        }
        return;
      }
      try {
        const vmsUpdates = fetchVmsDepartures(LiveTransit.chemnitzStationId(stop.id), manualBoardStop === stop);
        const scope = stop.platformOnly ? '&radius=0&exactRadius=true' : '';
        const fetchBoard = (time, { extra = '', version = 'v5', nearby = false } = {}, cursor) => {
          const area = nearby && stop.location ? `&center=${stopLatLng(stop).join(',')}&radius=35` : scope;
          const page = cursor ? `&pageCursor=${encodeURIComponent(cursor)}` : '';
          return safeFetchJSON(
            `${TRANSITOUS_BASE}/api/${version}/stoptimes?stopId=${encodeURIComponent(stop.id)}&time=${encodeURIComponent(new Date(time).toISOString())}${area}${extra}${page}`, 10_000);
        };
        const queryTime = now - 60_000;
        let source = { extra: '&n=40' };
        let data = await fetchBoard(queryTime, source);
        if (request !== departuresRequest) return;
        let board = boardEvents(data, stop);
        if (!board?.length) {
          const fallbackSource = { extra: '&n=40', version: 'v6', nearby: stop.platformOnly };
          const alternative = await fetchBoard(queryTime, fallbackSource);
          if (request !== departuresRequest) return;
          const matches = boardEvents(alternative, stop);
          if (matches?.length || board === null && matches) {
            data = alternative;
            board = matches;
            source = fallbackSource;
          }
        }
        const operator = await vmsUpdates;
        if (request !== departuresRequest) return;
        const operatorStop = { ...stop, platformLabel: LiveTransit.platformLabel(data?.place) || stop.platformLabel };
        const initialBoard = LiveTransit.vmsBoardEvents(board ?? [], operator, operatorStop);
        const today = LiveTransit.berlinLocal(now).slice(0, 10);
        const hasCurrent = LiveTransit.departures(initialBoard, true).some(dep =>
          Number.isFinite(boardTime(dep)) && isUpcomingBoardDeparture(dep, now) &&
          LiveTransit.berlinLocal(boardTime(dep)).slice(0, 10) === today);
        const visible = now - tripsFetchedAt <= LiveTransit.MAX_POSITION_AGE_MS
          ? boardEventsFromSegments(activeTripsCache, stop, now) : [];
        const arrivalSource = { extra: '&n=30&arriveBy=true&direction=LATER', version: 'v6' };
        const [fallback, arrivalsData] = hasCurrent ? [visible, null] : await Promise.all([
          visible.length ? visible : boardFromNearbyTrips(stop, now),
          fetchBoard(queryTime, arrivalSource)
        ]);
        if (request !== departuresRequest) return;
        const arrivals = boardEvents(arrivalsData, stop);
        boardConnectionIssue = board === null && arrivals === null && !initialBoard.length;
        if (boardConnectionIssue && currentDepartures.length) {
          updateDepartureCountdowns();
          return;
        }
        const events = [...(board ?? [])];
        const represented = new Set(events.map(event => event.tripId));
        for (const event of [...(arrivals ?? []).map(item => ({ ...item, arrivalOnly: true })), ...fallback]) {
          if (!represented.has(event.tripId)) {
            events.push(event);
            represented.add(event.tripId);
          }
        }
        const combined = LiveTransit.vmsBoardEvents(events, operator, operatorStop);
        const receivedAt = Date.now();
        const entries = LiveTransit.departures(combined, true).filter(dep => {
          updateBoardVehicleStatus(dep, mapVehiclePosition(dep.tripId, receivedAt), receivedAt);
          return isUpcomingBoardDeparture(dep, receivedAt);
        });
        const note = entries.some(dep => fallback.some(event => event.tripId === dep.tripId) &&
          !(board ?? []).some(event => event.tripId === dep.tripId)) ? 'რეისის მარშრუტიდან მიღებული მონაცემები' : '';
        const loaded = board !== null || arrivals !== null || entries.length > 0;
        if (!loaded && silent && currentDepartures.length) return;
        const headHorizon = Math.max(...LiveTransit.departures(board ?? [], true).map(boardTime).filter(Number.isFinite));
        for (const [key, dep] of paging.tail) {
          if (!paging.arrivalOnly && boardTime(dep) < headHorizon) paging.tail.delete(key);
        }
        paging.head = entries;
        paging.operator = operator;
        paging.operatorStop = operatorStop;
        if (!paging.cursors.size && !paging.loading) {
          const arrivalOnly = !data?.stopTimes?.length && Boolean(arrivalsData?.stopTimes?.length);
          paging.cursor = (arrivalOnly ? arrivalsData : data)?.nextPageCursor ?? '';
          paging.arrivalOnly = arrivalOnly;
          paging.fetch = cursor => fetchBoard(queryTime, arrivalOnly ? arrivalSource : source, cursor);
        }
        mergeBoardPages(paging, now);
        stopAlerts = data?.place?.alerts ?? [];
        if (stop.platformOnly) showSelectedPlatform(LiveTransit.platformLabel(
          ...(board ?? []).map(event => event.place), data?.place, arrivalsData?.place) ||
          stop.platformLabel || LiveTransit.platformLabel({ track: stop.platform }));
        departuresStatus = boardConnectionIssue ? connectionText : loaded ? 'მომდევნო რეისი ვერ მოიძებნა' : unavailableText;
        departuresNote = note;
        document.getElementById('lastUpdatedTime').textContent = loaded ? `განახლდა ${displayTime.format(new Date())}` : '';
        renderDeparturesList();
        return loaded && !boardConnectionIssue;
      } catch (error) {
        if (request !== departuresRequest) return;
        console.error('Departure board failed', error);
        boardConnectionIssue = true;
        if (currentDepartures.length) {
          updateDepartureCountdowns();
          return;
        }
        stopAlerts = [];
        departuresStatus = connectionText;
        departuresNote = '';
        document.getElementById('lastUpdatedTime').textContent = '';
        renderDeparturesList();
      }
    }

    function boardTime(dep) {
      return Date.parse(dep.when ?? dep.scheduledWhen);
    }

    function boardDisplayTimes(dep) {
      const arrival = LiveTransit.boardArrival(dep);
      const scheduledArrival = Date.parse(dep.scheduledArrival);
      return Number.isFinite(arrival) && Number.isFinite(scheduledArrival)
        ? [arrival, scheduledArrival] : [boardTime(dep), Date.parse(dep.scheduledWhen)];
    }

    function eventTimeMarkup(time, scheduled) {
      if (!Number.isFinite(time)) return waitingMarkup;
      const changed = Number.isFinite(scheduled) && scheduled !== time;
      const format = changed && displayTime.format(scheduled) === displayTime.format(time)
        ? displayTimeWithSeconds : displayTime;
      return `<strong class="event-time${changed && time > scheduled ? ' late' : ''}">${format.format(time)}</strong>` +
        (changed ? ` <del class="text-slate-400">${format.format(scheduled)}</del>` : '');
    }

    function currentMapTrip(tripId, now) {
      const trip = activeTripsCache.get(tripId);
      return trip && now - trip.fetchedAt <= LiveTransit.MAX_POSITION_AGE_MS ? trip : null;
    }

    function mapApproach(dep, now) {
      const trip = currentMapTrip(dep.tripId, now);
      return trip && LiveTransit.tripApproach(trip, dep.stopId, now);
    }

    function isBoardTripPlanned(dep, position, now, today) {
      if (position?.beforeStart) return true;
      if (position || dep.arrivalObserved || dep.departureObserved) return false;
      const trip = currentMapTrip(dep.tripId, now);
      if (trip?.legs.some(leg => leg.to?.stopId === dep.stopId && leg.departure <= now)) return false;
      const first = trip?.legs[0];
      if (first?.from?.stopId === dep.stopId && first.departure > now) return true;
      return LiveTransit.isPlannedDeparture(dep, now, today) || (dep.scheduledOnly && !dep.arrivalLive);
    }

    function distanceLabel(meters) {
      return meters >= 1000 ? `${(meters / 1000).toFixed(1)} კმ` : `${Math.round(meters)} მ`;
    }

    function boardCountdownTime(dep, now) {
      return boardStopTiming(dep, now)?.arrival ?? NaN;
    }

    function boardStopTiming(dep, now) {
      if (!dep) return null;
      const operatorTime = time => dep.operatorForecast ? LiveTransit.operatorEstimate(time) : time;
      const stop = { name: dep.stopName || selectedStop?.name };
      const departure = dep.arrivalOnly ? NaN : operatorTime(boardTime(dep));
      const actualArrival = LiveTransit.boardArrival(dep);
      const arrival = dep.arrivalObserved ? actualArrival : dep.operatorForecast ? operatorTime(actualArrival)
        : LiveTransit.stopForecastTime(actualArrival, dep, 'PREDICTED');
      if (Number.isFinite(arrival)) return LiveTransit.stopWindow(arrival, departure, stop);
      const scheduledDwell = Date.parse(dep.scheduledWhen) - Date.parse(dep.scheduledArrival);
      if (dep.operatorForecast && scheduledDwell > 0) {
        return LiveTransit.stopWindow(departure - scheduledDwell, departure, stop);
      }
      const trip = currentMapTrip(dep.tripId, now);
      const mapTiming = trip && LiveTransit.tripStopWindow(trip, dep.stopId, now);
      if (mapTiming) return LiveTransit.stopWindow(mapTiming.arrival, dep.operatorForecast ? departure : mapTiming.departure, stop);
      if (dep.tripId === trackedTripId && trackedPositionRoute && now - trackedFetchedAt <= LiveTransit.MAX_POSITION_AGE_MS) {
        const route = trackedPositionRoute;
        const routeTiming = LiveTransit.routeStopWindow(route, route.stops[route.target]?.stopId ?? dep.stopId, now);
        if (routeTiming) return LiveTransit.stopWindow(routeTiming.arrival, dep.operatorForecast ? departure : routeTiming.departure, stop);
      }
      return LiveTransit.stopWindow(operatorTime(boardTime(dep)), departure, stop);
    }

    function approximateStopStatus(timing, now) {
      if (!timing || !(timing.arrival <= now)) return '';
      if (now < timing.departure) return approxAtStop;
      return now < timing.departure + departureNoticeMs ? approxDeparted : '';
    }

    function isUpcomingBoardDeparture(dep, now) {
      const notice = boardPaging?.departed.get(boardDepartureKey(dep));
      if (notice && !dep.cancelled && !dep.skipped) return notice.until > now;
      const timing = boardStopTiming(dep, now);
      if (!dep.cancelled && !dep.skipped && !dep.departureObserved &&
          (timing?.arrival > now || !isBoardTripPlanned(dep, mapVehiclePosition(dep.tripId, now), now) && approximateStopStatus(timing, now))) return true;
      if (!boardEventExpired(dep, boardTime(dep), now)) return true;
      const position = mapVehiclePosition(dep.tripId, now);
      return isBoardVehicleAtStop(dep, position, now) || hasRecentStopObservation(dep, now) ||
        Boolean(LiveTransit.stopStatus(dep, position, now));
    }

    function isBoardVehicleAtStop(dep, position, now) {
      return Boolean(dep.stopId && !dep.cancelled && !dep.skipped && Number.isFinite(position?.observedAt) &&
        position.stopped && position.stopId === dep.stopId &&
        !(dep.departureObserved && Date.parse(dep.departure ?? dep.when) <= now));
    }

    function boardDepartureKey(dep) {
      return dep.operatorKey ?? JSON.stringify([dep.tripId, dep.stopId, dep.scheduledWhen ?? dep.when]);
    }

    function recordBoardDeparture(dep, until) {
      const key = boardDepartureKey(dep);
      boardPaging.atStop.delete(key);
      boardPaging.departed.set(key, { dep, until });
    }

    function hasRecentStopObservation(dep, now) {
      const arrival = boardPaging?.atStop.get(boardDepartureKey(dep));
      return !dep.cancelled && !dep.skipped && !(dep.departureObserved && Date.parse(dep.departure ?? dep.when) <= now) &&
        arrival <= now && now - arrival <= LiveTransit.MAX_POSITION_AGE_MS;
    }

    function updateBoardVehicleStatus(dep, position, now) {
      if (!boardPaging || dep.cancelled || dep.skipped) return '';
      const key = boardDepartureKey(dep);
      const notice = boardPaging.departed.get(key);
      if (notice) return notice.until > now ? departedText : '';
      const observed = Date.parse(dep.departure ?? dep.when);
      const justDeparted = dep.departureObserved && observed <= now &&
        (now - observed < departureNoticeMs || boardPaging.atStop.has(key));
      const atStop = isBoardVehicleAtStop(dep, position, now);
      const leftStop = position?.observedAt > boardPaging.atStop.get(key) &&
        position.stopId && position.stopId !== dep.stopId;
      if (justDeparted || leftStop) {
        recordBoardDeparture(dep, now + departureNoticeMs);
        return departedText;
      }
      const arrival = atStop ? position.observedAt : dep.arrivalObserved ? Date.parse(dep.arrival) : NaN;
      if (arrival <= now && arrival > (boardPaging.atStop.get(key) ?? -Infinity)) boardPaging.atStop.set(key, arrival);
      return hasRecentStopObservation(dep, now) ? 'გაჩერებაზეა' : '';
    }

    function mergeBoardPages(paging, now = Date.now()) {
      const statusTime = Date.now();
      if (statusTime - tripsFetchedAt <= LiveTransit.MAX_POSITION_AGE_MS) {
        const missing = new Set([...paging.head, ...paging.tail.values()]
          .filter(dep => !dep.cancelled && !dep.skipped && !currentMapTrip(dep.tripId, statusTime))
          .map(dep => dep.tripId));
        if (missing.size) {
          const segments = latestMapSegments.filter(segment => segment.trips?.some(trip => missing.has(trip.tripId)));
          for (const [id, trip] of LiveTransit.mapTrips(segments, tripsFetchedAt, missing)) {
            if (missing.has(id)) activeTripsCache.set(id, trip);
          }
        }
      }
      for (const dep of [...paging.head, ...currentDepartures]) {
        updateBoardVehicleStatus(dep, mapVehiclePosition(dep.tripId, statusTime), statusTime);
      }
      for (const [key, dep] of paging.tail) {
        if (!isUpcomingBoardDeparture(dep, now)) paging.tail.delete(key);
      }
      const entries = new Map(paging.tail);
      for (const dep of paging.head) {
        const key = boardDepartureKey(dep);
        const linked = entries.get(key);
        entries.set(key, dep.operatorOnly && linked && !linked.operatorOnly
          ? { ...linked, ...dep, tripId: linked.tripId, stopId: linked.stopId, operatorOnly: false }
          : dep);
      }
      for (const [key, notice] of paging.departed) {
        const dep = entries.get(key);
        if ((!dep && notice.until <= statusTime) || dep?.cancelled || dep?.skipped) {
          paging.departed.delete(key);
        } else if (!dep) entries.set(key, notice.dep);
      }
      for (const key of paging.atStop.keys()) if (!entries.has(key)) paging.atStop.delete(key);
      currentDepartures = [...entries.values()].filter(dep => isUpcomingBoardDeparture(dep, now))
        .sort((a, b) => boardTime(a) - boardTime(b));
    }

    function visibleBoardDepartures(now = Date.now()) {
      return currentDepartures.filter(dep => isUpcomingBoardDeparture(dep, now) &&
        enabledTransportTypes.has(getLineStyle(dep.line.name, dep.line.product).category));
    }

    async function loadMoreBoardDepartures() {
      const paging = boardPaging;
      if (!paging || paging.loading) return;
      const target = paging.limit + BOARD_PAGE_SIZE;
      const startingHead = paging.head;
      paging.loading = true;
      paging.error = false;
      renderDeparturesList();
      try {
        // Bound each click's work when filters exclude most of a stop's departures.
        for (let attempts = 0; paging.cursor && visibleBoardDepartures().length < target && attempts < 8; attempts++) {
          const cursor = paging.cursor;
          const data = await paging.fetch(cursor);
          if (boardPaging !== paging) return;
          const events = boardEvents(data, paging.stop);
          if (!events) throw new Error('Departure page unavailable');
          if (!paging.cursors.size) {
            for (const dep of startingHead) paging.tail.set(boardDepartureKey(dep), dep);
          }
          paging.cursors.add(cursor);
          const next = data.nextPageCursor;
          paging.cursor = data.stopTimes.length && next && !paging.cursors.has(next) ? next : '';
          const rows = paging.arrivalOnly ? events.map(event => ({ ...event, arrivalOnly: true })) : events;
          const matched = LiveTransit.vmsBoardEvents(rows, paging.operator ?? [], paging.operatorStop ?? paging.stop, false);
          for (const dep of LiveTransit.departures(matched, true)) paging.tail.set(boardDepartureKey(dep), dep);
          mergeBoardPages(paging);
        }
      } catch {
        paging.error = true;
      } finally {
        if (boardPaging === paging) {
          paging.limit = Math.max(paging.limit, Math.min(target, visibleBoardDepartures().length));
          paging.loading = false;
          renderDeparturesList();
        }
      }
    }

    function formatCountdown(time, now = Date.now()) {
      if (!Number.isFinite(time) || time <= now) return waitingText;
      const seconds = Math.ceil((time - now) / 1000);
      return `${Math.floor(seconds / 60)} წთ ${String(seconds % 60).padStart(2, '0')} წმ`;
    }

    function boardEventExpired(dep, time, now) {
      if (!Number.isFinite(time)) return true;
      if (dep.scheduledOnly || dep.departureObserved) return time < now;
      // A prediction can expire between two polls. Keep the row visible until the next update.
      return time < now - REFRESH_MS;
    }

    const stopStatusLabels = {
      confirmed: 'გაჩერებაზეა',
      arrived: 'გაჩერებაზეა'
    };

    function syncScrollLabel(element) {
      const content = element.firstElementChild;
      const width = element.clientWidth;
      const isConnectionBanner = element.classList.contains('connection-countdown') && element.dataset.kind !== 'departure';
      const overflow = width && !isConnectionBanner ? content.offsetWidth - width : 0;
      element.toggleAttribute('data-overflow', overflow > 1);
      if (overflow > 1) {
        element.style.setProperty('--scroll-offset', `-${overflow}px`);
        element.style.setProperty('--scroll-duration', `${Math.max(7, overflow / 9 + 2)}s`);
        element.title = content.textContent;
      } else {
        element.removeAttribute('title');
      }
    }

    const scrollLabelObserver = typeof ResizeObserver === 'function' ? new ResizeObserver(entries => {
      const labels = new Set(entries.map(entry => entry.target.closest('[data-scroll-label]')));
      for (const label of labels) if (label?.isConnected) syncScrollLabel(label);
    }) : null;

    function observeScrollLabels(root, observe = true) {
      for (const label of root.querySelectorAll('[data-scroll-label]')) {
        if (observe) {
          scrollLabelObserver?.observe(label);
          scrollLabelObserver?.observe(label.firstElementChild);
          if (!scrollLabelObserver) syncScrollLabel(label);
        } else {
          scrollLabelObserver?.unobserve(label);
          scrollLabelObserver?.unobserve(label.firstElementChild);
        }
      }
    }

    function setScrollLabelText(element, text) {
      if (element.firstElementChild.textContent === text) return;
      element.firstElementChild.textContent = text;
      if (element.hasAttribute('data-overflow')) element.title = text;
      if (!scrollLabelObserver) syncScrollLabel(element);
    }

    function paintCountdown(element, time, now, label = null) {
      const text = label ?? (Number.isFinite(time) && time <= now ? '0 წთ 00 წმ' : formatCountdown(time, now));
      const connectionIssue = text === connectionText;
      const urgent = label === null && Number.isFinite(time) && Math.ceil((time - now) / 1000) < 60;
      element.classList.toggle('connection-countdown', connectionIssue);
      element.classList.toggle('waiting-text', text === waitingText);
      element.classList.toggle('countdown-urgent', urgent);
      element.classList.toggle('stopped-clock', text === 'გაჩერებაზეა');
      element.classList.toggle('departed-clock', text === departedText);
      element.classList.toggle('approximate-clock', text === approxAtStop || text === approxDeparted);
      if (element.dataset?.scrollLabel !== undefined) {
        setScrollLabelText(element, text);
        return;
      }
      if (connectionIssue) {
        if (!element.firstElementChild || element.textContent !== connectionText) element.innerHTML = '<span>კავშირის ხარვეზი</span>';
        return;
      }
      if (element.textContent === text && !element.firstElementChild) return;
      element.textContent = text;
    }

    function updateDepartureCountdowns() {
      updateSiteIndicator();
      const now = Date.now();
      const today = LiveTransit.berlinLocal(now).slice(0, 10);
      const connectionIssue = boardConnectionIssue || browserOffline();
      let nextFound = false;
      document.querySelectorAll('[data-board-trip]').forEach(row => {
        const dep = currentDepartures[Number(row.dataset.boardTrip)];
        if (!dep) return;
        if (connectionIssue) {
          paintCountdown(row.querySelector('[data-countdown]'), NaN, now, connectionText);
          return;
        }
        const position = mapVehiclePosition(dep.tripId, now, dep.tripId === trackedTripId ? trackedPositionRoute : null);
        const vehicleStatus = updateBoardVehicleStatus(dep, position, now);
        const departed = vehicleStatus === departedText;
        const planned = !vehicleStatus && isBoardTripPlanned(dep, position, now, today);
        const stopStatus = LiveTransit.stopStatus(dep, position, now);
        const departure = Date.parse(dep.when ?? dep.scheduledWhen);
        const timing = boardStopTiming(dep, now);
        const eta = timing?.arrival;
        const approximate = !planned && !dep.departureObserved && !Number.isFinite(position?.observedAt)
          ? approximateStopStatus(timing, now) : '';
        const stopped = isBoardVehicleAtStop(dep, position, now);
        const plannedChip = row.querySelector('[data-board-planned]');
        plannedChip.classList.toggle('hidden', !planned);
        row.querySelector('[data-board-status]')?.classList.toggle('hidden', planned);
        row.hidden = !departed && (boardPaging?.departed.has(boardDepartureKey(dep)) ||
          (!stopped && !Number.isFinite(position?.observedAt) && !approximate && !(eta > now) &&
            !planned && timing?.departure + departureNoticeMs <= now) ||
          (!approximate && !stopStatus && !vehicleStatus && (dep.departureObserved || !(eta > now)) && boardEventExpired(dep, departure, now)));
        row.parentElement.hidden = row.hidden;
        const isNext = !row.hidden && !departed && !nextFound;
        row.classList.toggle('next-departure', isNext);
        nextFound ||= isNext;
        const label = departed ? departedText : planned ? plannedText : stopped ? atStopText :
          approximate === approxDeparted ? approximate : vehicleStatus || stopStatusLabels[stopStatus] || approximate || null;
        paintCountdown(row.querySelector('[data-countdown]'), eta, now, label);
      });
      const cards = document.querySelectorAll('#departuresList .departure-card');
      if (cards.length) document.getElementById('departuresCountBadge').textContent = [...cards].filter(card => !card.hidden).length;
    }

    function renderDeparturesList() {
      const listEl = document.getElementById('departuresList');
      if (!selectedStop) return;
      const filtered = visibleBoardDepartures();
      const limit = boardPaging?.limit ?? BOARD_PAGE_SIZE;
      const displayed = filtered.slice(0, limit);
      document.getElementById('departuresCountBadge').textContent = displayed.length;
      const rows = displayed.map(dep => {
        const style = getLineStyle(dep.line.name, dep.line.product);
        const cancelled = dep.cancelled || dep.skipped;
        const [time, planned] = boardDisplayTimes(dep);
        const change = (time - planned) / 1000;
        const tint = cancelled ? '' : change > 0 ? ' timing-late' : change < 0 ? ' timing-early' : '';
        const delay = Math.abs(change) < 60 ? `${Math.round(Math.abs(change))} წმ` : `${Math.round(Math.abs(change) / 60)} წთ`;
        const status = dep.cancelled ? 'გაუქმებულია' : dep.skipped ? 'გაჩერებას გამოტოვებს' :
          !Number.isFinite(change) ? dep.arrivalOnly ? 'მოსვლა' : '' : change > 0 ? `+${delay}` :
          change < 0 ? `−${delay}` : 'დროულად';
        return `
          <div>
            <button type="button" ${dep.operatorOnly ? 'disabled' : `onclick="openVehicleInSidebar('${tripClick(dep.tripId)}', true, ${currentDepartures.indexOf(dep)})"`}
              class="departure-card${tint}" ${cancelled ? '' : `data-board-trip="${currentDepartures.indexOf(dep)}"`}>
              <span class="departure-line" style="--line-color:${style.bg}; color:var(--line-color)">${style.svg} ${escapeHTML(style.formattedLabel)}</span>
              <span class="departure-main">
                <span class="departure-direction" data-scroll-label><span>${escapeHTML(dep.direction)}</span></span>
                <span class="departure-meta">
                  ${!cancelled && Number.isFinite(time) ? eventTimeMarkup(time, planned) : ''}
                  ${status ? `<span data-board-status class="departure-chip ${cancelled ? 'error' : change ? 'warn' : 'good'}">${status}</span>` : ''}
                  ${cancelled ? '' : '<span data-board-planned class="departure-chip hidden">გეგმიური</span>'}
                  ${dep.platform ? `<span class="departure-chip">${dep.platformChanged ? 'ახალი ბაქანი' : 'ბაქანი'} ${escapeHTML(dep.platform)}</span>` : ''}
                </span>
              </span>
              <span class="departure-count" ${cancelled ? 'hidden' : ''}>
                <span class="text-right waiting-text" data-countdown data-scroll-label><span>${waitingText}</span></span><small>${dep.operatorForecast && !dep.arrivalLive ? 'დარჩენილია' : dep.operatorOnly ? 'მხოლოდ ტაბლო' : 'რუკაზე ნახვა'}</small>
              </span>
            </button>
            ${renderAlerts(dep.alerts)}
          </div>`;
      }).join('') || `<div class="py-10 text-center text-xs text-slate-400">${departuresStatus}</div>`;
      const more = filtered.length > limit || boardPaging?.cursor
        ? `<div class="py-3 text-center">
          ${boardPaging?.error ? '<p class="mb-2 text-xs text-slate-400" role="status">მომდევნო რეისები ვერ ჩაიტვირთა</p>' : ''}
          <button type="button" onclick="loadMoreBoardDepartures()" ${boardPaging?.loading ? 'disabled aria-busy="true"' : ''}
            class="px-4 py-2 text-sm font-bold text-blue-400 hover:underline disabled:opacity-60">${boardPaging?.loading ? 'იტვირთება' : 'მეტის ჩვენება'}</button></div>` : '';
      observeScrollLabels(listEl, false);
      listEl.innerHTML = renderAlerts(stopAlerts) + (departuresNote ? `<p class="px-2 py-1 text-xs font-semibold text-slate-300">${departuresNote}</p>` : '') + rows + more;
      observeScrollLabels(listEl);
      updateDepartureCountdowns();
    }

    /*************************************************************************
     * 8. VEHICLE POSITIONS
     *************************************************************************/
    function animateMarkers() {
      animationFrame = 0;
      const now = Date.now();
      let moving = false;
      for (const marker of [...liveVehicleMarkers.values(), ...(focusedVehicle ? [focusedVehicle] : [])]) {
        const position = marker.samplePosition?.(now);
        if (!position || position.observedAt) continue;
        marker.setLatLng([position.lat, position.lng]);
        if (!position.stopped) moving = true;
      }
      if (moving) animationFrame = requestAnimationFrame(animateMarkers);
    }

    function moveMarker(marker, position, id, route = null) {
      marker.setLatLng([position.lat, position.lng]);
      const smooth = !position.observedAt && !position.stopped && !position.retained &&
        !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      marker.samplePosition = smooth ? now => mapVehiclePosition(id, now, route) : null;
      if (smooth && !animationFrame) animationFrame = requestAnimationFrame(animateMarkers);
    }

    function vehicleTooltip(trip, style, position) {
      const info = tooltipDirections.get(trip.tripId);
      const direction = info?.direction ?? trip.direction;
      const stop = trip.legs.flatMap(leg => [leg.from, leg.to]).find(place => place?.stopId && place.stopId === position.stopId);
      const stops = position.retained ? '<div class="vehicle-tooltip-stops">ბოლო ხელმისაწვდომი მდებარეობა</div>'
        : !position.observedAt && position.stopped && position.from?.name
        ? `<div class="vehicle-tooltip-stops">შეფასებული მდებარეობა · ${escapeHTML(position.from.name)}</div>`
        : !position.observedAt && (position.from?.name || position.to?.name)
        ? `<div class="vehicle-tooltip-stops">შეფასებული მდებარეობა<br>${escapeHTML(position.from?.name ?? waitingText)} ${directionArrow} ${escapeHTML(position.to?.name ?? waitingText)}</div>`
        : stop
        ? `<div class="vehicle-tooltip-stops">${position.stopped ? 'გაჩერებაზეა' : 'შემდეგი'} · ${escapeHTML(stop.name)}</div>`
        : '';
      return `<div class="vehicle-tooltip-heading">${style.svg} ${escapeHTML(info?.names || style.formattedLabel)} ${directionArrow} ${escapeHTML(direction)}</div>${stops}`;
    }

    async function loadTooltipDirection(id) {
      const saved = tooltipDirections.get(id);
      if (saved && Date.now() - saved.time < 90_000) return;
      tooltipDirections.set(id, { ...saved, time: Date.now() });
      const data = await safeFetchJSON(`${TRANSITOUS_BASE}/api/v5/trip?tripId=${encodeURIComponent(id)}&joinInterlinedLegs=false`);
      const leg = Array.isArray(data?.legs) ? LiveTransit.throughService(data.legs, id) : null;
      if (!leg) return;
      const final = leg.service.at(-1);
      const names = [...new Set(leg.service.map(section =>
        getLineStyle(section.displayName || section.routeShortName, section.mode).formattedLabel))];
      tooltipDirections.set(id, { time: Date.now(), direction: final.headsign || final.to?.name, names: names.join(' / ') });
    }

    function vehicleMarkerIcon(style) {
      return L.divIcon({
        className: 'vehicle-marker-container', iconSize: [0, 0],
        html: `<div class="vehicle-label" style="--vehicle-color:${style.bg}">
          ${style.svg}<span>${escapeHTML(style.formattedLabel)}</span></div>`
      });
    }

    function updateFocusedVehicle(id, position, style) {
      if (focusedVehicle && (!position || focusedVehicleId !== id || liveVehicleMarkers.has(id))) {
        vehiclesLayerGroup.removeLayer(focusedVehicle);
        focusedVehicle = null;
      }
      if (!position || liveVehicleMarkers.has(id)) return;
      if (focusedVehicle) {
        moveMarker(focusedVehicle, position, id, trackedPositionRoute);
        return;
      }
      const icon = vehicleMarkerIcon(style);
      focusedVehicle = L.marker([position.lat, position.lng], { icon, zIndexOffset: 900 }).addTo(vehiclesLayerGroup);
      focusedVehicleId = id;
      if (!position.observedAt) focusedVehicle.bindTooltip('შეფასებული მდებარეობა', { className: 'custom-tooltip' });
      moveMarker(focusedVehicle, position, id, trackedPositionRoute);
    }

    function updateMapFocus() {
      if (!map || !stopsLayerGroup) return;
      const activeJourney = journey.visible && journey.selected && journey.layer?.getLayers().length;
      const activeTrip = trackedTripId && (trackedLine || focusedTargetMarker || trackedLayoverPosition);
      const focus = Boolean(activeJourney || activeTrip);
      if (focus && map.hasLayer(stopsLayerGroup)) map.removeLayer(stopsLayerGroup);
      if (!focus && !map.hasLayer(stopsLayerGroup)) stopsLayerGroup.addTo(map);
      if (!activeTrip && focusedVehicle) updateFocusedVehicle(null, null);
      const related = new Set(activeJourney
        ? journey.selected.legs.map(leg => leg.tripId)
        : activeTrip ? [trackedTripId, ...trackedLeg.service.map(leg => leg.tripId)] : []);
      for (const [id, marker] of liveVehicleMarkers) {
        const opacity = focus && !related.has(id) ? .3 : 1;
        if (marker.options.opacity !== opacity) marker.setOpacity(opacity);
        marker.getElement()?.classList.toggle('vehicle-muted', opacity < 1);
        const offset = focus && related.has(id) ? 800 : 0;
        if (marker.options.zIndexOffset !== offset) marker.setZIndexOffset(offset);
      }
    }
