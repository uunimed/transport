    function vehiclePosition(id, now) {
      const report = liveVehiclesState.get(id);
      return report && now - report.observedAt <= LiveTransit.MAX_POSITION_AGE_MS ? report : null;
    }

    function mapVehiclePosition(id, now, route = null) {
      return vehiclePosition(id, now) ?? estimateMapVehiclePosition(id, now, route);
    }

    function estimateMapVehiclePosition(id, now, route) {
      const routePosition = route && now - trackedFetchedAt <= LiveTransit.MAX_POSITION_AGE_MS
        ? LiveTransit.positionOnRoute(route, now) : null;
      const trip = activeTripsCache.get(id);
      return routePosition ?? (trip && now - trip.fetchedAt <= LiveTransit.MAX_POSITION_AGE_MS
        ? LiveTransit.estimatedPosition(trip, now) : null);
    }

    function updateLiveMarkers() {
      const now = Date.now();
      const bounds = map.getBounds();
      const cancelled = new Set(currentDepartures.filter(dep => dep.cancelled).map(dep => dep.tripId));
      const visible = new Set();
      const trackedActiveId = trackedLeg?.service.findLast(leg => Date.parse(leg.startTime) <= now)?.tripId ?? trackedTripId;
      for (const [id, trip] of activeTripsCache) {
        if (now - trip.fetchedAt > LiveTransit.MAX_POSITION_AGE_MS || cancelled.has(id) ||
            (trackedTripId === id && trackedLeg?.cancelled)) continue;
        const style = getLineStyle(trip.line.name, trip.line.product);
        if (!enabledTransportTypes.has(style.category)) continue;
        const existing = liveVehicleMarkers.get(id);
        const route = id === trackedActiveId ? trackedPositionRoute : null;
        const freshPosition = mapVehiclePosition(id, now, route) ?? (id === trackedActiveId ? trackedLayoverPosition : null);
        if (freshPosition?.beforeStart) continue;
        const lastPosition = existing?.lastPosition;
        const stillAtStop = lastPosition?.stopped && now < lastPosition.stoppedUntil;
        const position = freshPosition ?? (lastPosition && (stillAtStop || now - existing.lastPositionAt <= MARKER_GAP_MS)
          ? { ...lastPosition, retained: true } : null);
        if (!position || !bounds.contains([position.lat, position.lng])) continue;
        visible.add(id);
        const tooltip = vehicleTooltip(trip, style, position);
        if (existing) {
          if (freshPosition) {
            existing.lastPosition = freshPosition;
            existing.lastPositionAt = now;
          }
          moveMarker(existing, position, id, route);
          if (existing.tooltipContent !== tooltip) {
            existing.setTooltipContent(tooltip);
            existing.tooltipContent = tooltip;
          }
          continue;
        }
        const icon = vehicleMarkerIcon(style);
        const marker = L.marker([position.lat, position.lng], { icon, title: style.formattedLabel }).addTo(vehiclesLayerGroup);
        marker.lastPosition = position;
        marker.lastPositionAt = now;
        marker.tooltipContent = tooltip;
        marker.bindTooltip(tooltip, { className: 'custom-tooltip', direction: 'top', offset: [0, -12] });
        marker.on('click', () => openVehicleInSidebar(tripClick(id)));
        marker.on('mouseover', () => loadTooltipDirection(id));
        liveVehicleMarkers.set(id, marker);
        moveMarker(marker, position, id, route);
      }
      for (const [id, marker] of liveVehicleMarkers) {
        if (visible.has(id)) continue;
        vehiclesLayerGroup.removeLayer(marker);
        liveVehicleMarkers.delete(id);
        tooltipDirections.delete(id);
      }
      if (trackedTripId && trackedLeg && trackedRoute) updateTrackedView(now);
      else updateMapFocus();
    }

    /*************************************************************************
     * 9. ROUTE TRACKING
     *************************************************************************/
    function setTrackingText(id, text) {
      const element = document.getElementById(id);
      if (element.dataset?.scrollLabel !== undefined) setScrollLabelText(element, text);
      else if (element.textContent !== text || element.firstElementChild) element.textContent = text;
      element.classList.toggle('waiting-text', text === waitingText || text.endsWith(': ' + waitingText));
    }

    function setTrackingNotice(kind, text = '') {
      const summary = document.getElementById('trackingProgressSummary');
      summary.classList.toggle('tracking-offline', Boolean(kind));
      const notice = document.getElementById('trackConnection');
      notice.hidden = !kind;
      notice.dataset.kind = kind;
      setScrollLabelText(notice, text);
    }

    function setTrackingOffline(offline) {
      if (offline) showTrackedStationHold(null, null, Date.now());
      setTrackingNotice(offline ? 'offline' : '', offline ? connectionText : '');
    }

    function trackedBoardEvent() {
      if (!trackedFromBoard || !trackedBoardDeparture) return null;
      const key = boardDepartureKey(trackedBoardDeparture);
      return currentDepartures.find(dep => boardDepartureKey(dep) === key) ?? trackedBoardDeparture;
    }

    function updateTrackedBoardClock(now = Date.now()) {
      const dep = trackedBoardEvent();
      if (!dep || trackingDepartureTimer !== null) return;
      if (browserOffline()) {
        setTrackingOffline(true);
        return;
      }
      const position = mapVehiclePosition(dep.tripId, now);
      const status = updateBoardVehicleStatus(dep, position, now);
      if (status === departedText) {
        showTrackingDeparture(dep, now);
        return;
      }
      const timing = boardStopTiming(dep, now);
      const eta = timing?.arrival;
      const stopStatus = LiveTransit.stopStatus(dep, position, now);
      const cancelled = dep.cancelled || dep.skipped;
      const planned = !status && !stopStatus && isBoardTripPlanned(dep, position, now);
      const approximate = !cancelled && !planned && !dep.departureObserved && !Number.isFinite(position?.observedAt)
        ? approximateStopStatus(timing, now) : '';
      const stopped = isBoardVehicleAtStop(dep, position, now);
      if (approximate === approxDeparted && !stopped) {
        showTrackingDeparture(dep, now, true);
        return;
      }
      const approach = !cancelled && !planned ? mapApproach(dep, now) : null;
      const fallback = cancelled ? 'გაუქმებულია' : planned ? plannedText : updatingPositionText;
      setTrackingText('trackNextStop', cancelled || planned ? fallback : approach?.nextStop ?? position?.to?.name ?? fallback);
      setTrackingText('trackDistance', approach ? distanceLabel(approach.meters) : fallback);
      setTrackingText('trackRemaining', approach ? String(approach.remaining) : fallback);
      setTrackingText('trackArrivalLabel', 'დრო');
      paintCountdown(document.getElementById('trackArrival'), eta, now,
        cancelled ? fallback : status || stopStatusLabels[stopStatus] || approximate ||
          (planned ? plannedText : boardConnectionIssue && !(eta > now) ? connectionText : null));
    }

    function showTrackedStationHold(stop, position, now) {
      const notice = document.getElementById('trackingStationHold');
      if (!stop?.name || !position?.stopped) {
        trackedStationHold = null;
      } else if (trackedStationHold?.stop !== stop.stopId) {
        trackedStationHold = { stop: stop.stopId, since: position.stoppedSince ?? position.observedAt ?? now };
      }
      const holdUntil = position?.stoppedUntil ?? now;
      const longHold = trackedStationHold && holdUntil - trackedStationHold.since >= LONG_STATION_HOLD_MS;
      document.getElementById('trackingProgressSummary').classList.toggle('hidden', Boolean(longHold));
      notice.classList.toggle('hidden', !longHold);
      if (longHold) {
        const text = 'გაჩერებულია სადგურზე: ' + stop.name;
        if (notice.textContent !== text) notice.textContent = text;
      }
    }

    async function openVehicleInSidebar(encodedTripId, fromBoard = false, boardIndex = -1) {
      resetTrackingDeparture();
      trackedConnectionIssue = false;
      trackedFromBoard = fromBoard;
      setTrackingOffline(fromBoard && browserOffline());
      trackingReturnTab = activeSidebarTab;
      setJourneyVisible(false);
      document.getElementById('trackedStopSummary').classList.toggle('hidden', !fromBoard);
      trackedTripId = decodeURIComponent(encodedTripId);
      trackedLeg = null;
      trackedRoute = null;
      trackedPositionRoute = null;
      trackedLayoverPosition = null;
      trackedLine = null;
      focusedTargetMarker = null;
      trackedGeometry = '';
      routeProgressFloor = 0;
      showTrackedStationHold(null, null, Date.now());
      routeOverlayLayerGroup.clearLayers();
      updateMapFocus();
      const clickedDeparture = currentDepartures[boardIndex];
      const departure = clickedDeparture?.tripId === trackedTripId
        ? clickedDeparture : currentDepartures.find(dep => dep.tripId === trackedTripId);
      trackedBoardDeparture = fromBoard ? departure : null;
      trackedTargetId = fromBoard ? (departure?.stopId || selectedStop?.id) : null;
      trackedTargetTime = Date.parse(departure?.arrival ?? departure?.when);
      document.getElementById('sidebarTabsBar').classList.add('hidden');
      ['Departures', 'Journey', 'Favorites'].forEach(t => document.getElementById('tabContent' + t).classList.add('hidden'));
      document.getElementById('tabContentVehicleDetails').classList.remove('hidden');
      setTrackingText('trackLineBadge', waitingText);
      setTrackingText('trackDirectionTitle', 'იტვირთება');
      setTrackingText('trackArrivalLabel', 'დრო');
      for (const field of ['trackNextStop', 'trackArrival', 'trackDistance', 'trackRemaining']) setTrackingText(field, 'იტვირთება');
      if (trackedBoardDeparture) {
        const style = getLineStyle(departure.line.name, departure.line.product);
        const badge = document.getElementById('trackLineBadge');
        badge.innerHTML = style.svg + escapeHTML(style.formattedLabel);
        badge.style.color = style.bg;
        badge.classList.remove('waiting-text');
        setTrackingText('trackDirectionTitle', departure.direction || 'იტვირთება');
        updateTrackedBoardClock();
      }
      document.getElementById('trackStopsTimeline').replaceChildren();
      await refreshTrackedTrip(true);
    }

    async function refreshTrackedTrip(fitBounds = false) {
      const request = ++tripRequest;
      const id = trackedTripId;
      if (browserOffline()) {
        trackedConnectionIssue = true;
        if (trackedFromBoard && trackingDepartureTimer === null) setTrackingOffline(true);
        return;
      }
      const query = `tripId=${encodeURIComponent(id)}&joinInterlinedLegs=false`;
      let data = await safeFetchJSON(`${TRANSITOUS_BASE}/api/v5/trip?${query}`, 12_000);
      if (request !== tripRequest || id !== trackedTripId) return;
      if (!Array.isArray(data?.legs)) data = await safeFetchJSON(`${TRANSITOUS_BASE}/api/v6/trip?${query}`, 10_000);
      if (request !== tripRequest || id !== trackedTripId) return;
      trackedConnectionIssue = !Array.isArray(data?.legs);
      if (trackedConnectionIssue && trackedRoute) return;

      const leg = Array.isArray(data?.legs) ? LiveTransit.throughService(data.legs, id) : null;
      trackedLeg = leg ?? null;
      trackedFetchedAt = Date.now();
      trackedRoute = null;
      trackedPositionRoute = null;
      if (!leg) {
        trackedLine = null;
        focusedTargetMarker = null;
        routeOverlayLayerGroup.clearLayers();
        updateMapFocus();
        showTrackedStationHold(null, null, Date.now());
        const boardEvent = trackedBoardEvent();
        setTrackingText('trackDirectionTitle', boardEvent?.direction || 'მარშრუტი მიუწვდომელია');
        for (const field of ['trackNextStop', 'trackDistance', 'trackRemaining']) {
          setTrackingText(field, boardEvent ? updatingPositionText : unavailableText);
        }
        if (boardEvent) {
          updateTrackedBoardClock();
        } else if (trackedConnectionIssue && trackingDepartureTimer === null) {
          paintCountdown(document.getElementById('trackArrival'), NaN, Date.now(), connectionText);
        } else {
          setTrackingText('trackArrival', unavailableText);
        }
        document.getElementById('trackStopsTimeline').replaceChildren();
        return;
      }
      const style = getLineStyle(leg.displayName, leg.mode);
      const badge = document.getElementById('trackLineBadge');
      const serviceNames = [...new Set(leg.service.map(segment =>
        getLineStyle(segment.displayName || segment.routeShortName, segment.mode).formattedLabel))];
      badge.innerHTML = style.svg + escapeHTML(serviceNames.join(' / '));
      badge.classList.remove('waiting-text');
      const geometry = JSON.stringify(leg.service.map(segment => segment.legGeometry?.points));
      if (geometry !== trackedGeometry) {
        routeProgressFloor = 0;
        trackedGeometry = geometry;
      }
      badge.style.color = style.bg;
      setTrackingText('trackDirectionTitle', leg.service.at(-1).headsign || leg.to?.name || waitingText);
      if (!trackedFromBoard && trackedLine) {
        routeOverlayLayerGroup.removeLayer(trackedLine);
        trackedLine = null;
      }
      trackedRoute = LiveTransit.routeProgress(leg, trackedTargetId, trackedTargetTime);
      if (trackedFromBoard && trackedRoute.target < 0 && selectedStop?.id !== trackedTargetId) {
        trackedRoute = LiveTransit.routeProgress(leg, selectedStop?.id, trackedTargetTime);
      }
      if (trackedFromBoard && trackedRoute.target < 0 && selectedStop) {
        const matching = trackedRoute.stops.filter(stop => !stop.cancelled && belongsToBoard(stop, selectedStop));
        if (matching.length === 1) trackedRoute = LiveTransit.routeProgress(leg, matching[0].stopId, trackedTargetTime);
      }
      trackedPositionRoute = null;
      const { stops, target } = trackedRoute;
      const rows = stops.map((stop, index) => {
        const [time, scheduled] = routeStopTimes(stop, index === target);
        const value = leg.cancelled || stop.cancelled ? 'გამოტოვებულია' : eventTimeMarkup(time, scheduled);
        return `<li data-route-stop="${index}" class="route-step ${index === target ? 'target' : ''}">
          <span class="route-node" aria-hidden="true"></span>
          <div class="route-step-main">
            <span class="route-stop-name">${escapeHTML(stop.name)}</span>
            ${stop.lineChange ? `<small class="route-note">${directionArrow} ხაზის ცვლილება · ${escapeHTML(stop.lineChange)}</small>` : ''}
            ${renderAlerts(stop.alerts)}
          </div>
          <div class="route-step-meta"><span data-route-time>${value}</span><small data-route-label></small></div>
        </li>`;
      }).join('');
      document.getElementById('trackStopsTimeline').innerHTML =
        renderAlerts(leg.alerts) + `<ol class="route-steps">${rows}</ol>`;
      updateTrackedView(Date.now());
      if (fitBounds) fitTrackedRouteBounds();
    }

    function routeStopTimes(stop, arrival) {
      const useArrival = arrival ? Boolean(stop.arrival ?? stop.scheduledArrival) : !(stop.departure ?? stop.scheduledDeparture);
      return useArrival ? [Date.parse(stop.arrival ?? stop.scheduledArrival), Date.parse(stop.scheduledArrival)]
        : [Date.parse(stop.departure ?? stop.scheduledDeparture), Date.parse(stop.scheduledDeparture)];
    }

    function routeLayover(route, position, report, now) {
      const origin = route.stops.find(stop => !stop.cancelled);
      const departure = LiveTransit.stopForecastTime(Date.parse(origin?.departure ?? origin?.scheduledDeparture),
        origin, origin?.departureTimestampReason);
      if (report?.stopped && report.stopId === origin?.stopId && origin?.departureTimestampReason !== 'OBSERVED') {
        return report;
      }
      if (!report && position?.beforeStart) return position;
      if (!report && !position && departure > now && departure - now <= APPROACHING_START_MS &&
          origin?.departureTimestampReason !== 'OBSERVED' && [origin?.lat, origin?.lon].every(Number.isFinite) &&
          !route.stops.some(stop => stop !== origin && stop.arrivalTimestampReason === 'OBSERVED' && Date.parse(stop.arrival) <= now)) {
        return { lat: origin.lat, lng: origin.lon, stopped: true, beforeStart: true, from: origin, stoppedUntil: departure };
      }
      if (position?.stopped && position.from?.lineChange && now < position.stoppedUntil) return position;
      const interchange = report?.stopped && route.stops.find(stop => stop.lineChange && stop.stopId === report.stopId &&
        Date.parse(stop.arrival) <= now && now < Date.parse(stop.departure ?? stop.scheduledDeparture));
      if (interchange) return report;
      const terminal = route.stops.findLast(stop => !stop.cancelled);
      if (!terminal || ![terminal.lat, terminal.lon].every(Number.isFinite)) return null;
      if (report) return report.stopped && report.stopId === terminal.stopId ? report : null;
      if (position && (!position.stopped || position.from?.stopId !== terminal.stopId)) return null;
      const arrival = LiveTransit.routeStopWindow(route, terminal.stopId, now)?.arrival ??
        Date.parse(terminal.arrival ?? terminal.scheduledArrival);
      if (!(arrival <= now)) return null;
      return { lat: terminal.lat, lng: terminal.lon, stopped: true, from: terminal };
    }

    function layoverPath(route, position, stop) {
      if (!position || !Number.isFinite(stop?.lat) || !Number.isFinite(stop?.lon)) return [];
      const from = [position.lat, position.lng];
      const to = [stop.lat, stop.lon];
      if (from.every((value, index) => value === to[index])) return [];
      const index = route.stops.findIndex(place => place.stopId === (position.from?.stopId ?? position.stopId));
      const a = route.projected[index], b = route.projected[route.target];
      const path = Number.isFinite(a) && Number.isFinite(b) ? route.points.slice(Math.min(a, b), Math.max(a, b) + 1) : [];
      return [from, ...(a > b ? path.reverse() : path), to];
    }

    function updateTrackedView(now) {
      if (trackingDepartureTimer !== null) return;
      if (browserOffline()) {
        if (trackedFromBoard) setTrackingOffline(true);
        return;
      }
      const { stops, target } = trackedRoute;
      const targetStop = stops[target];
      const cancelled = trackedLeg.cancelled || targetStop?.cancelled ||
        (trackedFromBoard && currentDepartures.some(dep => dep.tripId === trackedTripId && (dep.cancelled || (dep.skipped && dep.stopId === trackedTargetId))));
      const boardDeparture = trackedBoardEvent();
      const operatorTime = boardDeparture?.operatorForecast ? boardDeparture.when : null;
      if (!trackedPositionRoute || operatorTime !== trackedOperatorTime) {
        trackedOperatorTime = operatorTime;
        trackedPositionRoute = LiveTransit.routeWithOperatorTime(trackedRoute, boardDeparture);
      }
      const activeLeg = trackedLeg.service.findLast(segment => Date.parse(segment.startTime) <= now) ?? trackedLeg;
      const activeId = activeLeg.tripId;
      const report = vehiclePosition(activeId, now);
      const estimated = !report?.stopId ? estimateMapVehiclePosition(activeId, now, trackedPositionRoute) : null;
      const layover = !cancelled && routeLayover(trackedPositionRoute, estimated, report, now);
      trackedLayoverPosition = layover || null;
      const position = report ?? estimated ?? layover;
      const indexOfStop = place => {
        return stops.findIndex(stop => place && (stop === place || place.stopId && stop.stopId === place.stopId));
      };
      const reportedStop = indexOfStop(report);
      const estimatedFrom = indexOfStop(estimated?.from ?? layover?.from);
      const estimatedTo = indexOfStop(estimated?.to);
      const previousStop = estimatedFrom >= 0 ? estimatedFrom
        : estimatedTo >= 0 && estimated && !estimated.stopped
          ? stops.findLastIndex((stop, index) => index < estimatedTo && !stop.cancelled) : -1;
      const lastStop = stops.findLastIndex(stop => !stop.cancelled &&
        (stop.arrivalTimestampReason === 'OBSERVED' && Date.parse(stop.arrival) <= now ||
         stop.departureTimestampReason === 'OBSERVED' && Date.parse(stop.departure) <= now));
      const moving = reportedStop >= 0 ? report.stopped === false : Boolean(estimated && !estimated.stopped);
      const current = reportedStop >= 0
        ? moving ? stops.findLastIndex((stop, index) => index < reportedStop && !stop.cancelled) : reportedStop
        : previousStop >= 0 ? previousStop : lastStop;
      const next = moving && reportedStop >= 0 ? reportedStop
        : current >= 0 ? stops.findIndex((stop, index) => index > current && !stop.cancelled) : -1;
      const originIndex = stops.findIndex(stop => !stop.cancelled);
      const origin = trackedPositionRoute.stops[originIndex];
      const tripStart = Date.parse(origin?.departure ?? origin?.scheduledDeparture ?? trackedLeg.service[0]?.startTime);
      const atOrigin = report?.stopped && reportedStop >= 0 && stops[reportedStop].stopId === origin?.stopId;
      const started = origin?.departureTimestampReason === 'OBSERVED' && tripStart <= now;
      const planned = !started && lastStop <= originIndex &&
        (atOrigin || (tripStart > now && !report && (!estimated || estimated.beforeStart)));
      const atTarget = !planned && Boolean(report?.stopped && reportedStop === target && target >= 0);
      const connectionIssue = trackedConnectionIssue || (!position && mapConnectionIssue);
      const approach = boardDeparture && !planned ? mapApproach(boardDeparture, now) : null;
      const fallback = planned ? plannedText : updatingPositionText;
      showTrackedStationHold(cancelled || planned || atTarget || connectionIssue || layover ? null : stops[reportedStop], report, now);
      document.getElementById('trackedStopSummary').classList.toggle('hidden', !trackedFromBoard && !layover);
      setTrackingNotice(layover ? 'layover' : '', layover ? 'უცდის ახალ მარშრუტს' : '');
      setTrackingText('trackNextStop', cancelled ? 'გაუქმებულია' : planned && !layover ? plannedText :
        stops[next]?.name ?? approach?.nextStop ?? (current >= 0 ? 'ბოლო გაჩერება' : fallback));
      const useBoardArrival = boardDeparture?.arrivalObserved && targetStop?.arrivalTimestampReason !== 'OBSERVED';
      const useBoardDeparture = boardDeparture?.departureObserved && targetStop?.departureTimestampReason !== 'OBSERVED';
      const targetEvent = targetStop && {
        ...boardDeparture, stopId: targetStop.stopId,
        cancelled: Boolean(cancelled),
        arrival: useBoardArrival ? boardDeparture.arrival : targetStop.arrival ?? boardDeparture?.arrival,
        when: useBoardDeparture ? boardDeparture.when : targetStop.departure ?? boardDeparture?.when,
        departure: useBoardDeparture ? boardDeparture.departure : targetStop.departure ?? boardDeparture?.departure,
        arrivalLive: LiveTransit.hasLiveTime(targetStop.arrivalTimestampReason) || boardDeparture?.arrivalLive,
        arrivalObserved: targetStop.arrivalTimestampReason === 'OBSERVED' || boardDeparture?.arrivalObserved,
        departureObserved: targetStop.departureTimestampReason === 'OBSERVED' || boardDeparture?.departureObserved
      };
      const recordedDeparture = targetEvent?.departureObserved && Date.parse(targetEvent.departure) <= now;
      const passedTarget = target >= 0 && (lastStop > target || reportedStop > target);
      const boardStatus = boardDeparture && !planned ? updateBoardVehicleStatus(boardDeparture, report, now) : '';
      if (!cancelled && trackedFromBoard && (recordedDeparture || passedTarget || boardStatus === departedText)) {
        showTrackingDeparture(boardDeparture ?? trackedBoardDeparture, now);
        return;
      }
      const stopStatus = targetEvent && LiveTransit.stopStatus(targetEvent, report, now);
      const boardTiming = boardStopTiming(boardDeparture, now);
      const boardEta = boardTiming?.arrival;
      const routeArrival = LiveTransit.stopForecastTime(Date.parse(targetEvent?.arrival ?? targetStop?.scheduledArrival),
        targetStop, useBoardArrival ? 'OBSERVED' : targetStop?.arrivalTimestampReason);
      const modeledTiming = targetStop?.stopId && LiveTransit.routeStopWindow(trackedPositionRoute, targetStop.stopId, now);
      const useLiveArrival = !boardDeparture?.arrivalLive && LiveTransit.hasLiveTime(targetStop?.arrivalTimestampReason) && Number.isFinite(routeArrival);
      const actualDeparture = boardDeparture?.operatorForecast ? LiveTransit.operatorEstimate(boardTime(boardDeparture))
        : Date.parse(targetEvent?.departure ?? targetStop?.scheduledDeparture);
      const timing = useLiveArrival ? LiveTransit.stopWindow(routeArrival, actualDeparture, targetStop)
        : Number.isFinite(boardEta) ? boardTiming : modeledTiming ?? LiveTransit.stopWindow(routeArrival, actualDeparture, targetStop);
      const eta = timing.arrival;
      const approximate = trackedFromBoard && !cancelled && !planned && !report && !recordedDeparture
        ? approximateStopStatus(timing, now) : '';
      if (approximate === approxDeparted) {
        showTrackingDeparture(boardDeparture, now, true);
        return;
      }
      if ((approximate === approxAtStop || atTarget && now < timing.departure) &&
          layover && targetStop?.stopId === (layover.from?.stopId ?? layover.stopId)) {
        setTrackingNotice('', '');
      }
      setTrackingText('trackArrivalLabel', 'დრო');
      paintCountdown(document.getElementById('trackArrival'), eta, now,
        cancelled ? 'გაუქმებულია' : planned ? plannedText : boardStatus || stopStatusLabels[stopStatus] ||
          (atTarget ? atStopText : approximate || (connectionIssue && !Number.isFinite(eta) ? connectionText : null)));
      const remaining = !planned && current >= 0 && target >= 0
        ? stops.slice(current + 1, target).filter(stop => !stop.cancelled).length : approach?.remaining ?? null;
      setTrackingText('trackRemaining', cancelled ? 'გაუქმებულია' : remaining === null ? fallback : String(remaining));
      const highlight = moving ? next : current;
      document.querySelectorAll('[data-route-stop]').forEach(row => {
        const index = Number(row.dataset.routeStop);
        const highlighted = !cancelled && index === highlight;
        row.classList.toggle('current', highlighted);
        row.classList.toggle('passed', !cancelled && (index < current || (moving && index === current)));
        if (highlighted) row.setAttribute('aria-current', 'step');
        else row.removeAttribute('aria-current');
        const label = highlighted ? (moving ? 'შემდეგი' : position ? 'მიმდინარე' : 'ბოლო დაფიქსირებული') : index === target ? 'სამიზნე' : '';
        const meta = row.querySelector('[data-route-label]');
        if (meta.textContent !== label) meta.textContent = label;
        if (index === target && !cancelled && boardDeparture) {
          const time = row.querySelector('[data-route-time]');
          const useBoardTimes = !useLiveArrival && (boardDeparture.arrivalLive || boardDeparture.operatorForecast || !boardDeparture.scheduledOnly);
          const markup = eventTimeMarkup(...(useBoardTimes ? boardDisplayTimes(boardDeparture) : routeStopTimes(targetStop, true)));
          if (time.dataset.markup !== markup) {
            time.innerHTML = markup;
            time.dataset.markup = markup;
          }
        }
      });
      const remainingPath = !cancelled && !planned && trackedFromBoard && position && current >= 0
        ? LiveTransit.remainingRoute(trackedRoute, position, current, routeProgressFloor) : null;
      if (remainingPath) routeProgressFloor = remainingPath.progress;
      const selectedLocation = selectedStop?.location;
      const layoverTarget = targetStop ?? (selectedLocation && { lat: selectedLocation.latitude, lon: selectedLocation.longitude });
      const path = cancelled ? [] : layover && layoverTarget ? layoverPath(trackedRoute, layover, layoverTarget)
        : trackedFromBoard ? remainingPath?.points ?? [] : trackedRoute.points;
      if (path.length > 1) {
        if (trackedLine) trackedLine.setLatLngs(path);
        else if (!trackedLine) trackedLine = L.polyline(path, { color: '#38bdf8', weight: 6, opacity: 0.9 }).addTo(routeOverlayLayerGroup);
      } else if (trackedLine) {
        routeOverlayLayerGroup.removeLayer(trackedLine);
        trackedLine = null;
      }
      if (trackedFromBoard && !cancelled && Number.isFinite(targetStop?.lat) && Number.isFinite(targetStop?.lon)) {
        if (focusedTargetMarker) focusedTargetMarker.setLatLng([targetStop.lat, targetStop.lon]);
        else focusedTargetMarker = L.circleMarker([targetStop.lat, targetStop.lon], {
          radius: 6, color: '#fff', fillColor: '#0284c7', fillOpacity: 1, weight: 2
        }).bindTooltip(escapeHTML(targetStop.name)).addTo(routeOverlayLayerGroup);
      } else if (focusedTargetMarker) {
        routeOverlayLayerGroup.removeLayer(focusedTargetMarker);
        focusedTargetMarker = null;
      }
      updateFocusedVehicle(activeId, cancelled || planned && !layover ? null : position,
        getLineStyle(activeLeg.displayName || activeLeg.routeShortName, activeLeg.mode));
      updateMapFocus();
      if (!trackedFromBoard) return;
      const meters = remainingPath?.meters ?? approach?.meters;
      const distance = cancelled ? 'გაუქმებულია' : Number.isFinite(meters) ? distanceLabel(meters) : fallback;
      setTrackingText('trackDistance', distance);
    }

    function fitTrackedRouteBounds() {
      if (trackedLine) map.fitBounds(trackedLine.getBounds(), { padding: [50, 50], maxZoom: 16 });
    }

    function showTrackingDeparture(departure, now, approximate = false) {
      if (!approximate && departure && boardPaging && boardPaging.stop === selectedStop) {
        recordBoardDeparture(departure, now + 2 * departureNoticeMs);
      }
      document.getElementById('trackingStationHold').classList.add('hidden');
      document.getElementById('trackingProgressSummary').classList.remove('hidden');
      setTrackingNotice('departure', approximate ? approxDeparted : departedText);
      trackingDepartureTimer = setTimeout(() => {
        clearTrackedTrip();
        if (boardPaging && boardPaging.stop === selectedStop) {
          mergeBoardPages(boardPaging);
          renderDeparturesList();
        }
        refreshSelectedStopDepartures(true);
      }, departureNoticeMs);
    }

    function resetTrackingDeparture() {
      clearTimeout(trackingDepartureTimer);
      trackingDepartureTimer = null;
      setTrackingNotice('', '');
    }

    function clearTrackedTrip(restoreTab = true) {
      resetTrackingDeparture();
      trackedTripId = null;
      trackedBoardDeparture = null;
      trackedLeg = null;
      trackedRoute = null;
      trackedPositionRoute = null;
      trackedLayoverPosition = null;
      trackedLine = null;
      focusedTargetMarker = null;
      routeOverlayLayerGroup.clearLayers();
      updateMapFocus();
      document.getElementById('tabContentVehicleDetails').classList.add('hidden');
      document.getElementById('sidebarTabsBar').classList.remove('hidden');
      if (restoreTab) switchSidebarTab(trackingReturnTab);
    }

    /*************************************************************************
     * 10. SIDEBAR TABS & RADAR
     *************************************************************************/
    function switchSidebarTab(tab) {
      activeSidebarTab = tab;
      setJourneyVisible(tab === 'journey');
      document.getElementById('tabContentVehicleDetails').classList.add('hidden');
      document.getElementById('sidebarTabsBar').classList.remove('hidden');

      ['Departures', 'Journey', 'Favorites'].forEach(t => {
        const el = document.getElementById('tabContent' + t);
        const btn = document.getElementById('tab' + t + 'Btn');
        if (t.toLowerCase() === tab) {
          el.classList.remove('hidden');
          btn.className = 'flex-1 py-2 px-3 rounded-t-xl text-xs font-bold border-b-2 border-blue-500 text-white bg-slate-900 flex items-center justify-center gap-1.5 transition';
        } else {
          el.classList.add('hidden');
          btn.className = 'flex-1 py-2 px-3 rounded-t-xl text-xs font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center justify-center gap-1.5 transition';
        }
      });

      if (tab === 'favorites') renderFavoritesList();
    }

    /*************************************************************************
     * 11. SEARCH & FAVORITES
     *************************************************************************/
    function stopCity(stop) {
      const places = (stop.areas ?? []).filter(area => area.adminLevel >= 6 && area.adminLevel <= 8);
      return places.find(area => area.adminLevel === 8)?.name ??
        places.find(area => area.default)?.name ??
        stop.name?.match(/\(([^()]+)\)$/)?.[1] ??
        (stop.name?.includes(',') ? stop.name.split(',')[0].trim() : '');
    }

    function setupSearchListener() {
      const input = document.getElementById('stopSearchInput');
      const dropdown = document.getElementById('searchDropdown');
      const clearBtn = document.getElementById('clearSearchBtn');
      let timer = null;

      input.addEventListener('input', () => {
        const q = input.value.trim();
        clearBtn.classList.toggle('hidden', !q);
        clearTimeout(timer);
        if (q.length < 2) { dropdown.classList.add('hidden'); return; }
        timer = setTimeout(async () => {
          dropdown.classList.remove('hidden');
          dropdown.innerHTML = `<div class="p-3 text-xs text-slate-400">იძებნება "${escapeHTML(q)}"...</div>`;
          const res = await safeFetchJSON(`${TRANSITOUS_BASE}/api/v1/geocode?text=${encodeURIComponent(q)}&type=STOP`);
          if (input.value.trim() !== q) return;
          if (!Array.isArray(res) || res.length === 0) {
            dropdown.innerHTML = `<div class="p-3 text-xs text-slate-400">ვერ მოიძებნა</div>`;
            return;
          }
          dropdown.innerHTML = res.map(st => {
            const stopObj = { id: st.id || st.stopId, name: st.name, location: { latitude: st.lat || st.latitude, longitude: st.lon || st.longitude } };
            return `
              <div onclick="selectSearchedStop('${tripClick(JSON.stringify(stopObj))}')" class="px-3.5 py-2.5 hover:bg-slate-800 cursor-pointer border-b border-slate-800 flex items-center justify-between">
                <span class="text-xs font-bold text-white">${escapeHTML(stopObj.name)}</span>
                <span class="ml-3 shrink-0 text-[11px] text-slate-400">${escapeHTML(stopCity(st))}</span>
              </div>
            `;
          }).join('');
        }, 250);
      });

      clearBtn.addEventListener('click', () => { input.value = ''; clearBtn.classList.add('hidden'); dropdown.classList.add('hidden'); });
    }

    async function selectSearchedStop(encoded) {
      const stop = JSON.parse(decodeURIComponent(encoded));
      document.getElementById('searchDropdown').classList.add('hidden');
      document.getElementById('stopSearchInput').value = stop.name;
      map.setView([stop.location.latitude, stop.location.longitude], 16);
      await selectStop(stop, false);
      await refreshMapViewData();
    }

    async function loadFavoritesFromSupabase() {
      try {
        const local = localStorage.getItem('de_transit_fav_stops');
        if (local) favoriteStops = JSON.parse(local);
      } catch (e) {}
      document.getElementById('favCountBadge').textContent = favoriteStops.length;
      updateFavoriteButtonUI();
      renderFavoritesList();
    }

    async function toggleFavoriteCurrentStop() {
      if (!selectedStop) return;
      const idx = favoriteStops.findIndex(s => String(s.id) === String(selectedStop.id));
      if (idx >= 0) {
        favoriteStops.splice(idx, 1);
        showToast('წაიშალა შენახულებიდან');
      } else {
        favoriteStops.unshift({
          id: selectedStop.id, name: selectedStop.name, location: selectedStop.location,
          platform: selectedStop.platform, platformOnly: selectedStop.platformOnly
        });
        showToast('შეინახა!');
      }
      localStorage.setItem('de_transit_fav_stops', JSON.stringify(favoriteStops));
      document.getElementById('favCountBadge').textContent = favoriteStops.length;
      updateFavoriteButtonUI();
      renderFavoritesList();
    }

    function updateFavoriteButtonUI() {
      const icon = document.getElementById('favStarIcon');
      const isFav = selectedStop && favoriteStops.some(s => String(s.id) === String(selectedStop.id));
      icon.setAttribute('fill', isFav ? '#facc15' : 'none');
    }

    function renderFavoritesList() {
      const container = document.getElementById('favoritesList');
      if (favoriteStops.length === 0) {
        container.innerHTML = `<div class="py-10 text-center text-xs text-slate-400">ინფორმაცია არ არის</div>`;
        return;
      }
      container.innerHTML = favoriteStops.map(st => `
        <div onclick="selectSearchedStop('${encodeURIComponent(JSON.stringify(st))}')" class="p-3 rounded-xl bg-slate-950/80 hover:bg-slate-800 border border-slate-800 cursor-pointer flex items-center justify-between">
          <span class="text-xs font-bold text-white">${st.name}</span>
          <span class="text-xs text-blue-400">გახსნა</span>
        </div>
      `).join('');
    }

    /*************************************************************************
     * 12. SETTINGS & UTILS
     *************************************************************************/
    function applyTheme(theme) {
      const light = theme !== 'dark';
      document.documentElement.classList.toggle('light', light);
      document.documentElement.classList.toggle('dark', !light);
      document.getElementById('map').classList.toggle('map-tiles-dark', !light);
      document.getElementById('themeSelect').value = light ? 'light' : 'dark';
    }

    function setTheme(theme) {
      applyTheme(theme);
      try {
        localStorage.setItem('de_transit_theme', theme);
      } catch {
        // The theme still applies for this visit.
      }
    }

    function setSettingsOpen(open) {
      document.getElementById('settingsModal').classList.toggle('hidden', !open);
      document.getElementById('mapRefreshControl').classList.toggle('hidden', open);
      pendingStartupStop = null;
      document.getElementById('settingsStartupStopInput').value = '';
      document.getElementById('settingsStartupDropdown').classList.add('hidden');
      document.getElementById('confirmStartupStop').disabled = true;
    }
    function openSettingsModal() { setSettingsOpen(true); }
    function closeSettingsModal() { setSettingsOpen(false); }

    function toggleTransportTypeSetting(cat) {
      if (enabledTransportTypes.has(cat)) {
        if (enabledTransportTypes.size > 1) enabledTransportTypes.delete(cat);
        else { showToast('მინიმუმ ერთი ტიპი უნდა იყოს ჩართული'); return; }
      } else enabledTransportTypes.add(cat);
      updateTransportTypeSettingsUI();
      renderDeparturesList();
      updateLiveMarkers();
    }
    function enableAllTransportTypes() { enabledTransportTypes = new Set(['tram', 'bus', 'suburban', 'regional']); updateTransportTypeSettingsUI(); renderDeparturesList(); updateLiveMarkers(); }
    function updateTransportTypeSettingsUI() {
      for (const key of ['tram', 'bus', 'suburban', 'regional']) {
        document.getElementById(`typeIcon-${key}`).innerHTML = TRANSPORT_SVGS[key];
        document.getElementById(`typeToggle-${key}`).setAttribute('aria-pressed', String(enabledTransportTypes.has(key)));
      }
    }

    let pendingStartupStop = null;
    function setupSettingsStartupStopSearch() {
      setupStopPicker('settingsStartupStopInput', 'settingsStartupDropdown', stop => {
        pendingStartupStop = stop;
        document.getElementById('confirmStartupStop').disabled = !stop;
      });
    }

    function confirmStartupStop() {
      if (!pendingStartupStop) return;
      localStorage.setItem('de_transit_custom_start_stop', JSON.stringify(pendingStartupStop));
      updateStartupStopSettingsUI();
      showToast(`საწყისად დაყენდა: ${pendingStartupStop.name}`);
      document.getElementById('confirmStartupStop').disabled = true;
    }

    function setupStopPicker(inputId, dropdownId, onChange) {
      const input = document.getElementById(inputId);
      const dropdown = document.getElementById(dropdownId);
      let timer;
      let request = 0;
      input.addEventListener('input', () => {
        clearTimeout(timer);
        const serial = ++request;
        const query = input.value.trim();
        onChange(null);
        dropdown.classList.add('hidden');
        if (query.length < 2) return;
        timer = setTimeout(async () => {
          const results = await safeFetchJSON(`${TRANSITOUS_BASE}/api/v1/geocode?text=${encodeURIComponent(query)}&type=STOP`);
          if (serial !== request || input.value.trim() !== query) return;
          dropdown.replaceChildren();
          for (const place of Array.isArray(results) ? results.slice(0, 6) : []) {
            if (!place.id) continue;
            const option = document.createElement('button');
            option.type = 'button';
            option.className = 'stop-picker-option';
            option.innerHTML = `<span>${escapeHTML(place.name)}</span><small>${escapeHTML(stopCity(place))}</small>`;
            option.addEventListener('click', () => {
              request++;
              input.value = place.name;
              dropdown.classList.add('hidden');
              onChange({ id: place.id, name: place.name, location: { latitude: place.lat, longitude: place.lon } });
            });
            dropdown.append(option);
          }
          if (!dropdown.children.length) dropdown.textContent = 'ვერ მოიძებნა';
          dropdown.classList.remove('hidden');
        }, 250);
      });
      input.addEventListener('keydown', event => {
        if (event.key === 'Escape') dropdown.classList.add('hidden');
        if (event.key === 'ArrowDown' && !dropdown.classList.contains('hidden')) {
          event.preventDefault();
          dropdown.querySelector('button')?.focus();
        }
      });
    }

    function resetToAutoGpsStartup() {
      localStorage.removeItem('de_transit_custom_start_stop');
      pendingStartupStop = null;
      document.getElementById('confirmStartupStop').disabled = true;
      document.getElementById('settingsStartupStopInput').value = '';
      updateStartupStopSettingsUI();
      locateUserDevice(true);
    }

    function updateStartupStopSettingsUI() {
      const badge = document.getElementById('startupModeStatusBadge');
      const raw = localStorage.getItem('de_transit_custom_start_stop');
      if (raw) {
        try {
          const s = JSON.parse(raw);
          badge.textContent = `არჩეულია: ${s.name}`;
          badge.className = 'px-2.5 py-1 rounded-full text-[11px] font-bold bg-blue-500/20 text-blue-300 border border-blue-500/40';
          return;
        } catch (e) {}
      }
      badge.textContent = 'აქტიურია: ავტომატური GPS მდებარეობა';
      badge.className = 'px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
    }

    function haversineMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = x => (x * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function initClock() {
      const el = document.getElementById('deClock');
      if (el) el.textContent = new Date().toLocaleTimeString('de-DE', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    let toastTimer = null;
    function showToast(msg) {
      const box = document.getElementById('toastBox');
      box.textContent = msg;
      box.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => box.classList.add('hidden'), 3500);
    }
  </script>
